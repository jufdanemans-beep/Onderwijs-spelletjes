<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mijn groeituintje • reflectie na de les</title><style>
:root{--ink:#394d40;--cream:#fff9ef;--green:#597762;--peach:#f2c5aa;--rose:#d48778}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:'Trebuchet MS',sans-serif;background:radial-gradient(ellipse at 15% 10%,#fae3c4,transparent 45%),radial-gradient(ellipse at 95% 65%,#e1e8cf,transparent 45%),#faf6ed}button,textarea{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,textarea:focus-visible{outline:3px solid #936841;outline-offset:5px}.shell{max-width:1160px;margin:auto;padding:24px 34px 40px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:bold;letter-spacing:1px;font-size:13px}.tools{display:flex;gap:8px}.quiet{border:1px solid #d9ded1;background:#ffffff80;border-radius:30px;padding:10px 15px;font-size:13px}header{text-align:center;margin:36px 0 0}.eyebrow{text-transform:uppercase;font-size:11px;letter-spacing:3px;color:#8c795d}h1{font-family:Georgia,serif;font-size:clamp(38px,6vw,66px);font-weight:normal;letter-spacing:-2px;margin:12px 0}h1 em{color:#a96751}p{line-height:1.6}.sub{color:#72806d;margin:0;font-size:17px}.landscape{height:200px;width:100%;overflow:visible;margin:0 auto -12px;display:block}.sway{transform-origin:center bottom;animation:sway 7s ease-in-out infinite}.flutter{animation:flutter 8s ease-in-out infinite}@keyframes sway{50%{transform:rotate(2deg)}}@keyframes flutter{50%{transform:translate(15px,-12px)}}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;position:relative}.card{border:1px solid #fff;background:#ffffffbc;padding:22px 20px 26px;text-align:left;border-radius:26px;box-shadow:0 8px 35px #6671550b;transition:.25s}.card:hover{transform:translateY(-5px);box-shadow:0 15px 35px #66715518}.card[aria-pressed=true]{border:2px solid #8aa184;padding:21px 19px 25px}.card svg{width:100%;height:110px}.number{display:block;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#92866e;margin:10px 0}.card h2{font-family:Georgia,serif;font-weight:no rflow:auto;text-align:center;position:relative}.close{position:absolute;right:16px;top:16px;border:0;background:#eee8d9;border-radius:50%;width:35px;height:35px}.dialog h2{font-family:Georgia,serif;font-size:30px;font-weight:normal;margin:7px}.wheel{width:290px;height:290px;max-width:75vw;display:block;margin:10px auto;transition:transform 2.7s cubic-bezier(.12,.65,.17,1)}.result{min-height:72px;font-size:19px;font-family:Georgia,serif;line-height:1.5;margin:15px 0}.pointer{margin-top:18px;font-size:24px;color:#976a4f;height:20px}.age{font-size:12px}.older .landscape{height:125px}.older .card svg{height:75px}body.older h1{font-size:48px}@media(max-width:700px){.shell{padding:20px}.top{align-items:flex-start}.tools{flex-wrap:wrap;justify-content:flex-end}.cards{gap:10px}.card{padding:15px 10px}.card[aria-pressed=true]{padding:14px 9px}.card h2{font-size:20px}.card svg{height:80px}.card p{font-size:12px}.panel{padding:24px 20px}.landscape{height:160px}.summary{grid-template-columns:1fr}.bottom{flex-wrap:wrap}.actions{align-items:flex-start}.hint{max-width:150px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}@media print{.tools,.bottom,.cards,.landscape,.actions{display:none}.shell{padding:0}.panel{box-shadow:none}body{background:white}}
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><g id="flower"><path d="M0 0Q-5 32 0 70" stroke="#6e8b60" stroke-width="4" fill="none"/><path d="M0 45Q-35 18-27 43Q-15 60 0 45M0 57Q29 25 28 48Q17 65 0 57" fill="#99ad7c"/><g fill="#e6ab94"><ellipse cy="-17" rx="12" ry="20"/><ellipse cy="-17" rx="12" ry="20" transform="rotate(60)"/><ellipse cy="-17" rx="12" ry="20" transform="rotate(120)"/><ellipse cy="-17" rx="12" ry="20" transform="rotate(180)"/><ellipse cy="-17" rx="12" ry="20" transform="rotate(240)"/><ellipse cy="-17" rx="12" ry="20" transform="rotate(300)"/></g><circle r="13" fill="#e8be68"/><circle cx="-4" cy="-1" r="1.4" fill="#715a3f"/><circle cx="4" cy="-1" r="1.4" fill="#715a3f"/><path d="M-4 4Q0 8 4 4" fill="none" stroke="#715a3f" stroke-width="1.4"/></g><g id="can"><path d="M30 5C70-25 88 20 66 42" fill="none" stroke="#748d7a" stroke-width="10"/><path d="M0 15L-30-7 -40 1 -10 44" fill="#92ad9a"/><path d="M-42-7L-31-15 -25-7 -37 7Z" fill="#607e6b"/><path d="M0 10Q30 4 57 10L63 68Q28 83-5 68Z" fill="#8da994"/><ellipse cx="28" cy="11" rx="28" ry="8" fill="#b7caba"/><path d="M11 25V57" stroke="#c1d2bf" stroke-width="5" stroke-linecap="round"/><path d="M-48 6l-5 9M-41 13l-4 10M-54 0l-8 7" stroke="#91b9bb" stroke-width="3" stroke-linecap="round"/></g><g id="stones"><ellipse cx="-30" cy="40" rx="44" ry="18" fill="#ccc7b4"/><ellipse cx="21" cy="10" rx="37" ry="16" fill="#e0d6bc"/><ellipse cx="-12" cy="-19" rx="29" ry="12" fill="#b6bda6"/><path d="M-55 35Q-35 28-15 33M0 5Q20 0 37 6" fill="none" stroke="#f5f0df" stroke-width="3" stroke-linecap="round"/></g><g id="butterfly"><path d="M0 0C-36-37-40 10-4 12C-30 27-7 39 0 11C7 39 30 27 4 12C40 10 36-37 0 0" fill="#d9a46d"/><path d="M0-4V16M0-3L-6-10M0-3L6-10" stroke="#86705b" stroke-width="2" fill="none"/></g></defs></svg>
<main class="shell"><div class="top"><span class="brand">🌿 EEN MOMENTJE OM TE GROEIEN</span><div class="tools"><button class="quiet" id="age">Rustige weergave</button><button class="quiet" id="reset">Nieuwe ronde</button><button class="quiet" id="full">⛶ Groot scherm</button></div></div><header><div class="eyebrow">Jouw les • jouw kleine stappen</div><h1 id="title">Mijn <em>groeituintje</em></h1><p class="sub">Kijk even terug. Wat neem jij mee van vandaag?</p></header>
<svg class="landscape" viewBox="0 0 1000 200" aria-label="Een rustige tuin met bloemen, een egeltje en vlinders" role="img"><path d="M30 178Q250 110 500 167Q700 110 970 177" fill="#e5e9d6"/><path d="M40 187Q340 149 500 185Q700 142 960 187" fill="#d9e0c7"/><g class="sway"><use href="#flower" transform="translate(175 95) scale(.8)"/><use href="#flower" transform="translate(225 126) scale(.5)"/><use href="#flower" transform="translate(795 113) scale(.65)"/></g><use href="#butterfly" class="flutter" transform="translate(325 55) scale(.5)"/><use href="#butterfly" transform="translate(735 65) scale(.35)"/><g transform="translate(570 145)"><path d="M-55 24L-63 3 -52-3 -54-18 -40-15 -32-32 -20-24 -5-36 4-25 20-30 25-16 39-17 38-2 50 7 43 24Z" fill="#ab8969"/><ellipse cx="0" cy="15" rx="46" ry="28" fill="#aa8768"/><path d="M24-2Q48-9 72 20Q51 44 21 36Z" fill="#efcfaa"/><circle cx="53" cy="13" r="3" fill="#493f35"/><circle cx="73" cy="20" r="4" fill="#493f35"/><ellipse cx="46" cy="23" rx="5" ry="3" fill="#dc9f86"/><path d="M-30 37v5M15 37v5" stroke="#6f614f" stroke-width="7" stroke-linecap="round"/><g stroke="#e0bb91" stroke-width="2"><path d="M-35 5l8 10M-15-4l8 10M6-5l8 10M-18 17l8 10M4 14l8 10"/></g></g><g fill="#a2b18a"><ellipse cx="90" cy="168" rx="5" ry="16" transform="rotate(-20 90 168)"/><ellipse cx="900" cy="170" rx="5" ry="18" transform="rotate(20 900 170)"/></g></svg>
<div class="cards"><button class="card" data-step="0" aria-pressed="false"><svg viewBox="-100 -50 200 130" aria-hidden="true"><use href="#flower"/></svg><span class="number">01 · Mijn bloeimoment <span class="done"></span></span><h2>Hier ben ik trots op</h2><p>Een klein succes mag ook stralen.</p></button><button class="card" data-step="1" aria-pressed="false"><svg viewBox="-100 -50 200 130" aria-hidden="true"><use href="#stones"/></svg><span class="number">02 · Mijn struikelsteen <span class="done"></span></span><h2>Dit vond ik lastig</h2><p>Je hoeft het nog niet te kunnen.</p></button><button class="card" data-step="2" aria-pressed="false"><svg viewBox="-100 -50 200 130" aria-hidden="true"><use href="#can" transform="translate(-10 -10)"/></svg><span class="number">03 · Mijn groeihulp <span class="done"></span></span><h2>Dit helpt mij groeien</h2><p>Wat helpt jou bij een volgende stap?</p></button></div>
<section class="panel" id="panel" aria-live="polite"></section><div class="bottom"><button class="wheel-open" id="openWheel">✿ Draai het groeiwiel <span class="age"> · een extra vraag</span></button><div class="progress" aria-label="Voortgang"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div><span class="footer">Elke kleine stap telt.</span></div></main>
<div class="modal" id="modal" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="wheelTitle"><button class="close" id="close" aria-label="Sluiten">×</button><div class="eyebrow">Een extra moment om terug te kijken</div><h2 id="wheelTitle">Het groeiwiel</h2><div class="pointer">▼</div><svg class="wheel" id="wheel" viewBox="0 0 320 320" aria-label="Bloem met acht reflectiethema’s" role="img"></svg><button class="primary" id="spin">Laat de bloem draaien</button><div class="result" id="result" aria-live="polite">Welke vraag bloeit er voor jou op?</div><p class="hint">Je mag ook een andere vraag kiezen. Antwoord hardop.</p></section></div>
<script>
const steps=[{title:'Wat ging goed vandaag?',intro:'Denk aan iets wat je deed, leerde of durfde. Ook iets kleins telt.',start:'Ik ben trots op…',choices:['Ik vroeg hulp','Ik probeerde het opnieuw','Ik leerde een woord','Ik verbeterde een fout','Ik sprak Nederlands','Ik werkte stap voor stap']},{title:'Wat vond je lastig vandaag?',intro:'Moeilijk mag moeilijk zijn. Vertel wat je nog wilt leren of wat je nodig had.',start:'Ik vond … lastig, omdat…',choices:['Een woord begrijpen','Een zin maken','Lezen','Spelling','Mijn aandacht erbij houden','Iets anders']},{title:'Wat helpt jou om verder te leren?',intro:'Kies wat bij jou past. Samen bedenken we één haalbare volgende stap.',start:'Volgende keer wil ik…',choices:['Een voorbeeld bekijken','Het in kleine stappen doen','Hulp vragen','Hardop nadenken','Nog een keer oefenen','Even pauzeren']}];
let current=0, selected=[new Set(),new Set(),new Set()], notes=['','',''], completed=[false,false,false], rotation=0, spinning=false, previousFocus;
const $=id=>document.getElementById(id); const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function sync(){document.querySelectorAll('.card').forEach((c,i)=>{c.setAttribute('aria-pressed',String(i===current));c.querySelector('.done').textContent=completed[i]?'✓':''});document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('on',completed[i]));}
function render(){const s=steps[current];$('panel').innerHTML='<h2>'+s.title+'</h2><p class="intro">'+s.intro+'</p><div class="chips">'+s.choices.map((v,i)=>'<button class="chip" data-choice="'+i+'" aria-pressed="'+selected[current].has(v)+'">'+v+'</button>').join('')+'</div><label class="label" for="note">'+s.start+' <span class="hint">(je mag ook hardop antwoorden)</span></label><textarea id="note" placeholder="Vertel het, of schrijf hier iets…">'+esc(notes[current])+'</textarea><div class="actions"><span class="hint">Er is geen goed of fout antwoord.</span><button class="primary" id="next">'+(current===2?'Mijn tuin laten bloeien ✿':'Verder naar de volgende stap →')+'</button></div>';document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{let v=s.choices[+b.dataset.choice];selected[current].has(v)?selected[current].delete(v):selected[current].add(v);b.setAttribute('aria-pressed',String(selected[current].has(v)))});$('note').oninput=e=>notes[current]=e.target.value;$('next').onclick=()=>{completed[current]=true;if(current<2){current++;render()}else{finish()}sync()};sync()}
function finish(){current=-1;$('panel').innerHTML='<div class="finish"><svg viewBox="-70 -50 140 135" aria-hidden="true"><use href="#flower"/></svg><div class="eyebrow">Even stilstaan is ook vooruitgaan</div><h2>Elke kleine stap telt.</h2><p class="intro">Je hebt teruggekeken. Kies samen één stap voor de volgende les.</p><div class="summary">'+steps.map((s,i)=>'<div><strong>'+['Mijn bloeimoment','Mijn struikelsteen','Mijn groeihulp'][i]+'</strong>'+esc([Array.from(selected[i]).join(' · '),notes[i]].filter(Boolean).join('\n')||'Mondeling besproken')+'</div>').join('')+'</div><label class="label" for="teacher">Wat zag jouw docent jou doen?</label><textarea id="teacher" placeholder="Ik zag dat jij…"></textarea><div class="actions"><span class="hint">Neem je volgende stap mee naar de volgende les.</span><button class="quiet" onclick="window.print()">Afdrukken / PDF</button></div></div>';sync()}
document.querySelectorAll('[data-step]').forEach(c=>c.onclick=()=>{current=+c.dataset.step;render()});$('reset').onclick=()=>{if(notes.some(Boolean)||completed.some(Boolean)||selected.some(s=>s.size)){if(!confirm('Een nieuwe ronde beginnen? De antwoorden van deze ronde verdwijnen.'))return}selected=[new Set(),new Set(),new Set()];notes=['','',''];completed=[false,false,false];current=0;render()};$('age').onclick=()=>{let on=document.body.classList.toggle('older');$('age').textContent=on?'Speelse weergave':'Rustige weergave';$('title').innerHTML=on?'Mijn <em>groei vandaag</em>':'Mijn <em>groeituintje</em>'};$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{ $('full').textContent='Gebruik F11 voor groot scherm'}};
const questions=['Wat kun je nu beter dan aan het begin?','Welke fout heeft jou iets geleerd?','Wanneer vroeg je hulp, of had je hulp nodig?','Wat wil je nog oefenen?','Welke aanpak hielp jou vandaag?','Wat deed je toen iets lastig werd?','Welke kleine stap wil je volgende keer zetten?','Waar ben je trots op, en waarom?'], words=['Geleerd','Fouten','Hulp','Oefenen','Aanpak','Proberen','Volgende stap','Trots'],colors=['#edc2a6','#dcae96','#b8c6a3','#e7cf8f','#a7bfaa','#d4baa4','#c9cba6','#e4b7ad'];
$('wheel').innerHTML=words.map((v,i)=>{let a=i*45;return '<g transform="rotate('+a+' 160 160)"><ellipse cx="160" cy="76" rx="43" ry="72" fill="'+colors[i]+'" stroke="#fff9ef" stroke-width="3"/><text x="160" y="58" text-anchor="middle" font-family="Trebuchet MS" font-size="12" fill="#435341" transform="rotate('+(-a)+' 160 58)">'+v+'</text></g>'}).join('')+'<circle cx="160" cy="160" r="39" fill="#f4dfac" stroke="#fff9ef" stroke-width="5"/><text x="160" y="168" text-anchor="middle" font-size="26" fill="#947452">✿</text>';
function closeModal(){$('modal').hidden=true;previousFocus?.focus()}$('openWheel').onclick=()=>{previousFocus=document.activeElement;$('modal').hidden=false;$('close').focus()};$('close').onclick=closeModal;$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};document.addEventListener('keydown',e=>{if($('modal').hidden)return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){let focusable=[$('close'),$('spin')].filter(el=>!el.disabled);let first=focusable[0],last=focusable[focusable.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});$('spin').onclick=()=>{if(spinning)return;spinning=true;$('spin').disabled=true;$('result').textContent='Er bloeit een vraag op…';let index=Math.floor(Math.random()*8);let target=(360-index*45)%360;rotation+=1080+(target-rotation%360+360)%360;$('wheel').style.transform='rotate('+rotation+'deg)';setTimeout(()=>{$('result').textContent=questions[index];$('spin').disabled=false;spinning=false},matchMedia('(prefers-reduced-motion: reduce)').matches?50:2800)};render();
</script></body></html>
