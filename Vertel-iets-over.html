<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vertel iets over… | NT2-spreekspel</title>
<style>
:root{--ink:#17324d;--blue:#3954d9}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:"Trebuchet MS",Arial,sans-serif;background:radial-gradient(circle at 8% 10%,#fff2a8 0 7rem,transparent 7.1rem),radial-gradient(circle at 96% 90%,#c7f1df 0 9rem,transparent 9.1rem),#fff9ed}button{font:inherit}button:focus-visible{outline:4px solid var(--ink);outline-offset:3px}.shell{min-height:100vh;padding:20px}.top{max-width:1440px;margin:0 auto 16px;display:flex;justify-content:space-between;align-items:center}.eyebrow{margin:0;color:#d34763;font-weight:900;letter-spacing:.14em;text-transform:uppercase;font-size:13px}h1{margin:0;font-size:clamp(32px,5vw,60px);line-height:1}.reset{border:2px solid var(--ink);background:#fff;border-radius:99px;padding:12px 16px;font-weight:900;box-shadow:0 4px 0 var(--ink);cursor:pointer}.layout{max-width:1440px;margin:auto;display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,.65fr);gap:16px;align-items:start}.card{border:3px solid var(--ink);border-radius:26px;background:#fffffff0;box-shadow:0 10px 0 var(--ink)}.boardbox{padding:14px}.board{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:9px}.tile{min-height:112px;border:2px solid var(--ink);border-radius:16px;padding:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;background:#eaf0ff}.tile:nth-child(4n+1){background:#d7f5e8}.tile:nth-child(4n+2){background:#ffe8a8}.tile:nth-child(4n+3){background:#ffdbe3}.tile.free{background:#8e6be8;color:#fff}.tile.special{background:var(--blue);color:#fff}.num{position:absolute;left:8px;top:5px;font-size:12px;font-weight:900;opacity:.6}.emo{font-size:27px}.label{font-size:clamp(12px,1vw,15px);font-weight:800;line-height:1.15}.active{z-index:2;transform:translateY(-5px) rotate(-1deg);box-shadow:0 7px 0 var(--ink),0 0 0 5px #fff,0 0 0 9px #ffb100}.pawn{position:absolute;right:5px;top:0;color:#ff5b3d;font-size:32px;text-shadow:0 2px #fff}.controls{padding:16px;display:grid;gap:14px;position:sticky;top:16px}.turn{background:#eef2ff;border:2px solid var(--ink);border-radius:20px;padding:18px;text-align:center}.where{background:var(--ink);color:#fff;border-radius:99px;padding:6px 11px;font-size:13px;font-weight:900}.bigemo{font-size:64px;margin:10px 0 2px}.turn h2{margin:0;font-size:clamp(24px,3vw,36px);line-height:1.05}.turn p{min-height:52px;font-size:17px;line-height:1.45}.listen{width:100%;border:0;background:#fff;color:var(--blue);border-radius:14px;padding:12px;font-weight:900;cursor:pointer}.listen:disabled{opacity:.45}.dice{border:3px solid var(--ink);border-radius:18px;min-height:76px;background:#ffd54f;color:var(--ink);box-shadow:0 5px 0 var(--ink);display:grid;grid-template-columns:42px 1fr 42px;align-items:center;padding:12px 16px;font-weight:900;cursor:pointer}.dice strong{font-size:36px}.dice:active{transform:translateY(4px);box-shadow:0 1px var(--ink)}.help{border:2px solid var(--ink);border-radius:18px;overflow:hidden}.help h3{margin:0;padding:12px;background:#d7f5e8}.starters{padding:10px;display:grid;gap:8px}.starters button{border:1px solid #b9c8d9;background:#f8fbff;border-radius:12px;padding:11px;text-align:left;font-weight:700;cursor:pointer}.tip{text-align:center;font-weight:900;margin:18px auto 0}@media(max-width:980px){.layout{grid-template-columns:1fr}.controls{position:static}}@media(max-width:700px){.shell{padding:12px}.board{grid-template-columns:repeat(3,1fr)}.tile{min-height:105px}.reset span{display:none}}
</style>
</head>
<body><main class="shell"><header class="top"><div><p class="eyebrow">NT2 · spreekspel</p><h1>Vertel iets over…</h1></div><button class="reset" onclick="resetGame()">↻ <span>Opnieuw</span></button></header><section class="layout"><div class="card boardbox"><div id="board" class="board"></div></div><aside class="card controls"><div class="turn"><span id="where" class="where"></span><div id="bigemo" class="bigemo"></div><h2 id="title"></h2><p id="instruction"></p><button id="listen" class="listen" onclick="speakPrompt()">🔊 Luister naar de opdracht</button></div><button id="dice" class="dice" onclick="throwDice()"><span style="font-size:30px">🎲</span><span id="dicelabel">Gooi de dobbelsteen</span><strong id="roll">?</strong></button><div class="help"><h3>❔ Hulpzinnen</h3><div class="starters"><button onclick="say(this.textContent)">Ik wil iets vertellen over … 🔊</button><button onclick="say(this.textContent)">Voor mij is dit belangrijk, omdat … 🔊</button><button onclick="say(this.textContent)">Eerst … Daarna … En toen … 🔊</button><button onclick="say(this.textContent)">Ik vind …, want … 🔊</button></div></div></aside></section><p class="tip">✨ Luister goed naar elkaar. Stel na elk antwoord één extra vraag.</p></main>
<script>
const data=[['Begin hier!','🚀','special'],['een goede vriend','🧑‍🤝‍🧑',''],['je huisdier of lievelingsdier','🐾',''],['je kamer','🛏️',''],['Vrije vraag','❓','free'],['iets waar je goed in bent','🏆',''],['een goed boek of verhaal','📚',''],['je lievelingsmuziek','🎵',''],['je smaak in kleren','👕',''],['je lievelingseten','🍕',''],['een spel dat je leuk vindt','🎮',''],['je familie','👨‍👩‍👧‍👦',''],['een spannende ervaring','🎢',''],['je lievelingsvak op school','🏫',''],['Vrije vraag','❓','free'],['een leuke tv-serie of film','📺',''],['wat je dit weekend wilt doen','🗓️',''],['iets wat je moet doen','✅',''],['een leuke gebeurtenis','🎉',''],['dromen','💭',''],['waar je trots op bent','🌟',''],['iets dat je verloren bent','🔎',''],['iets gevaarlijks','⚠️',''],['Vrije vraag','❓','free'],['een droom die je gehad hebt','🌙',''],['de toekomst','🔭',''],['een geluid dat je mooi vindt','🔔',''],['iets dat je mooi vindt','😍',''],['een avontuur','🧭',''],['Finish! Goed verteld!','🏁','special']];
let pos=0,busy=false;const order=[];for(let i=0;i<data.length;i+=6){let row=data.slice(i,i+6).map((x,j)=>({x,i:i+j}));if((i/6)%2)row.reverse();order.push(...row)}
function draw(){board.innerHTML=order.map(o=>`<div class="tile ${o.x[2]} ${o.i===pos?'active':''}"><span class="num">${o.i+1}</span><span class="emo">${o.x[1]}</span><span class="label">${o.x[0]}</span>${o.i===pos?'<span class="pawn">●</span>':''}</div>`).join('');const t=data[pos];where.textContent=`Je staat op vakje ${pos+1}`;bigemo.textContent=t[1];title.textContent=pos===0?'Klaar om te praten?':t[0];instruction.textContent=pos===0?'Gooi de dobbelsteen en ga naar je eerste vertelvak.':t[2]==='free'?'Bedenk zelf een vraag. Stel de vraag aan een andere speler.':pos===data.length-1?'Je hebt de finish bereikt. Knap gedaan!':`Vertel minimaal drie zinnen over ${t[0]}.`;listen.disabled=pos===0||pos===data.length-1;dice.disabled=busy||pos===data.length-1;dicelabel.textContent=pos===data.length-1?'Je bent klaar!':'Gooi de dobbelsteen'}
function throwDice(){if(busy||pos===data.length-1)return;busy=true;let n=0;const timer=setInterval(()=>{roll.textContent=Math.ceil(Math.random()*6);if(++n===8){clearInterval(timer);const r=Math.ceil(Math.random()*6);roll.textContent=r;pos=Math.min(pos+r,data.length-1);busy=false;draw()}},70)}
function say(text){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text.replace('🔊',''));u.lang='nl-NL';u.rate=.85;speechSynthesis.speak(u)}function speakPrompt(){say(data[pos][2]==='free'?'Bedenk zelf een vraag voor de andere speler.':`Vertel iets over ${data[pos][0]}.`)}function resetGame(){pos=0;roll.textContent='?';draw()}draw();
</script></body></html>
