<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zoems Kleurenzoekspel</title>
<style>
:root{--ink:#26344a;--cream:#fffaf0;--yellow:#ffd84d;--blue:#72d5ed}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"Trebuchet MS",Arial,sans-serif;color:var(--ink);background:linear-gradient(#8be0f5 0 58%,#bde987 58%);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 12% 16%,#fff 0 4%,transparent 4.3%),radial-gradient(circle at 88% 12%,#fff 0 5%,transparent 5.3%);opacity:.8;pointer-events:none}
.app{position:relative;max-width:980px;margin:auto;padding:20px;min-height:100vh;display:grid;grid-template-rows:auto 1fr auto}
header{text-align:center}.eyebrow{display:inline-block;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:6px 15px;font-weight:900;transform:rotate(-2deg)}
h1{font-size:clamp(2rem,6vw,4rem);margin:8px 0 0;color:#fff;text-shadow:0 4px 0 #26344a,3px 0 0 #26344a,-3px 0 0 #26344a}h1 span{color:var(--yellow)}
.game{display:grid;grid-template-columns:minmax(310px,1fr) minmax(270px,.75fr);gap:28px;align-items:center;margin-top:10px}
.wheel-wrap{position:relative;display:grid;place-items:center}.pointer{position:absolute;top:-8px;z-index:4;width:0;height:0;border-left:25px solid transparent;border-right:25px solid transparent;border-top:52px solid #26344a;filter:drop-shadow(0 3px 0 #fff)}
.wheel{width:min(68vw,440px);aspect-ratio:1;border-radius:50%;border:10px solid #fff;outline:5px solid var(--ink);background:conic-gradient(#ef476f 0 45deg,#ff9f1c 45deg 90deg,#ffe066 90deg 135deg,#57cc99 135deg 180deg,#3a86ff 180deg 225deg,#845ec2 225deg 270deg,#f15bb5 270deg 315deg,#f7f7f7 315deg);box-shadow:0 15px 0 rgba(38,52,74,.25);transition:transform 4s cubic-bezier(.12,.7,.14,1)}
.hub{position:absolute;width:28%;aspect-ratio:1;border-radius:50%;background:#fff;border:6px solid var(--ink);display:grid;place-items:center;font-size:clamp(2rem,7vw,4rem);z-index:3}
.side{display:flex;flex-direction:column;align-items:center;gap:12px}.bubble{position:relative;width:100%;min-height:108px;background:#fff;border:4px solid var(--ink);border-radius:28px;padding:18px 20px;text-align:center;font-size:clamp(1.05rem,2.5vw,1.45rem);font-weight:900;box-shadow:0 8px 0 rgba(38,52,74,.18)}.bubble:after{content:"";position:absolute;bottom:-24px;left:42%;border:12px solid transparent;border-top-color:var(--ink)}
.bee{position:relative;width:190px;height:150px;animation:float 2s ease-in-out infinite}.wing{position:absolute;width:72px;height:55px;background:rgba(255,255,255,.82);border:4px solid var(--ink);border-radius:60% 45%;top:20px}.wing.l{left:10px;transform:rotate(-25deg)}.wing.r{right:9px;transform:scaleX(-1) rotate(-25deg)}
.body{position:absolute;left:43px;top:28px;width:108px;height:92px;background:repeating-linear-gradient(90deg,var(--yellow) 0 23px,var(--ink) 23px 37px);border:5px solid var(--ink);border-radius:52% 48% 48% 52%;overflow:visible}.face{position:absolute;right:-2px;top:2px;width:65px;height:80px;border-radius:50%;background:var(--yellow)}.eye{position:absolute;top:22px;width:10px;height:15px;background:var(--ink);border-radius:50%}.eye.a{left:18px}.eye.b{right:13px}.smile{position:absolute;left:22px;top:48px;width:27px;height:15px;border-bottom:4px solid var(--ink);border-radius:50%}.antenna{position:absolute;width:37px;height:37px;border-top:4px solid var(--ink);border-radius:50%;top:-17px}.antenna.a{left:53px;transform:rotate(-20deg)}.antenna.b{left:73px;transform:rotate(12deg)}
.timer{display:none;align-items:center;gap:12px;background:#fff;border:4px solid var(--ink);padding:8px 18px;border-radius:999px;font-size:2rem;font-weight:900}.timer.show{display:flex}.clock{font-size:2.2rem}.time.danger{color:#e63946;animation:pulse .55s infinite}
button{border:4px solid var(--ink);border-radius:999px;background:var(--yellow);color:var(--ink);padding:15px 28px;font:900 1.35rem "Trebuchet MS",sans-serif;box-shadow:0 7px 0 var(--ink);cursor:pointer;transition:.12s}button:hover{transform:translateY(-2px)}button:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ink)}button:disabled{opacity:.55;cursor:not-allowed}
.found{display:none;background:#57cc99}.found.show{display:block}.result{font-size:1.25rem;font-weight:900;min-height:30px;text-align:center}
footer{text-align:center;font-weight:700;padding:8px}.stars{position:fixed;inset:0;pointer-events:none;z-index:10}.star{position:absolute;font-size:2rem;animation:pop 1.2s forwards}
@keyframes float{50%{transform:translateY(-9px) rotate(2deg)}}@keyframes pulse{50%{transform:scale(1.18)}}@keyframes pop{0%{opacity:0;transform:scale(0) rotate(0)}40%{opacity:1;transform:scale(1.4) rotate(160deg)}100%{opacity:0;transform:translateY(-100px) scale(.6) rotate(300deg)}}
@media(max-width:720px){.app{padding:12px}.game{grid-template-columns:1fr;gap:18px}.wheel{width:min(78vw,360px)}.side{gap:8px}.bubble{min-height:82px;padding:12px}.bee{width:160px;height:118px;transform:scale(.85);margin:-8px}.timer{font-size:1.55rem}h1{margin-top:4px}}
@media(prefers-reduced-motion:reduce){.bee,.time.danger{animation:none}.wheel{transition-duration:.8s}}
</style>
</head>
<body>
<main class="app">
  <header><div class="eyebrow">🐝 Samen met Zoem</div><h1>Het <span>kleuren</span>zoekspel!</h1></header>
  <section class="game" aria-label="Kleurenzoekspel">
    <div class="wheel-wrap"><div class="pointer"></div><div id="wheel" class="wheel"></div><div class="hub">🎨</div></div>
    <div class="side">
      <div id="bubble" class="bubble" aria-live="polite">Hoi! Ik ben Zoem. Draai aan het rad en zoek iets in die kleur!</div>
      <div class="bee" aria-label="Zoem de bij"><div class="wing l"></div><div class="wing r"></div><div class="body"><div class="antenna a"></div><div class="antenna b"></div><div class="face"><i class="eye a"></i><i class="eye b"></i><i class="smile"></i></div></div></div>
      <div id="timer" class="timer"><span class="clock">⏱️</span><span id="time" class="time">30</span><span>sec</span></div>
      <button id="spin">Draai het rad!</button><button id="found" class="found">Ik heb iets! ✨</button>
      <div id="result" class="result" aria-live="polite"></div>
    </div>
  </section>
  <footer>Tip: laat het kind het gevonden voorwerp voor de camera houden en benoemen (eventueel opschrijven).</footer>
</main><div id="stars" class="stars"></div>
<script>
const colors=[
  {name:'roods',hex:'#ef476f'},{name:'oranje',hex:'#ff9f1c'},{name:'geels',hex:'#ffe066'},
  {name:'groens',hex:'#57cc99'},{name:'blauws',hex:'#3a86ff'},{name:'paars',hex:'#845ec2'},
  {name:'rozes',hex:'#f15bb5'},{name:'wits',hex:'#f7f7f7'}
];
const wheel=document.querySelector('#wheel'),spin=document.querySelector('#spin'),found=document.querySelector('#found'),bubble=document.querySelector('#bubble'),timerBox=document.querySelector('#timer'),time=document.querySelector('#time'),result=document.querySelector('#result'),stars=document.querySelector('#stars');
let rotation=0,tick=null,busy=false;
function say(text){bubble.textContent=text}
function startTimer(color){let left=30;time.textContent=left;time.classList.remove('danger');timerBox.classList.add('show');found.classList.add('show');spin.style.display='none';say(`Zoek snel iets ${color.name}! Zoem, zoem, zoeken maar!`);tick=setInterval(()=>{left--;time.textContent=left;if(left<=10)time.classList.add('danger');if(left===10)say('Nog 10 tellen! Kun je iets vinden?');if(left<=0){clearInterval(tick);found.classList.remove('show');spin.style.display='block';spin.textContent='Nog een keer!';say('De tijd is om. Geeft niks! Zullen we nog eens draaien?');result.textContent='Goed gezocht! 🐝';busy=false}},1000)}
spin.addEventListener('click',()=>{if(busy)return;busy=true;result.textContent='';timerBox.classList.remove('show');spin.disabled=true;say('Bzzzz... Welke kleur wordt het?');const index=Math.floor(Math.random()*colors.length);const extra=1440;const target=360-(index*45+22.5);rotation+=extra+((target-(rotation%360)+360)%360);wheel.style.transform=`rotate(${rotation}deg)`;setTimeout(()=>{spin.disabled=false;startTimer(colors[index])},4100)});
found.addEventListener('click',()=>{clearInterval(tick);timerBox.classList.remove('show');found.classList.remove('show');spin.style.display='block';spin.textContent='Nog een kleur!';say('Wat knap! Laat maar zien voor de camera. Zoem is trots op jou!');result.textContent='🎉 Super gevonden! 🎉';busy=false;for(let i=0;i<18;i++){const s=document.createElement('span');s.className='star';s.textContent=['⭐','✨','🌟'][i%3];s.style.left=(10+Math.random()*80)+'%';s.style.top=(30+Math.random()*55)+'%';s.style.animationDelay=(Math.random()*.35)+'s';stars.appendChild(s);setTimeout(()=>s.remove(),1700)}});
</script>
</body>
</html>
