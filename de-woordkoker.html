<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>De woordkoker</title><style>
:root{--ink:#183448;--blue:#00a9b7;--yellow:#ffc83d;--coral:#f26c5b}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;color:var(--ink);font:18px "Trebuchet MS",Arial,sans-serif;background:linear-gradient(145deg,#dff7f8,#fff7d8)}main{width:min(820px,100%);padding:clamp(24px,5vw,50px);border:4px solid var(--ink);border-radius:34px;background:#fff;box-shadow:12px 14px 0 #1834482e}header{display:flex;align-items:center;gap:16px}.num{display:grid;place-items:center;width:60px;height:60px;border-radius:50%;background:var(--blue);color:#fff;font-size:26px;font-weight:900}h1{margin:0;font-size:clamp(38px,7vw,66px);line-height:1}header p{margin:0;color:#087b86;font-weight:bold;text-transform:uppercase}.intro{line-height:1.5}.tubes{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:24px 0}.tube{min-height:160px;display:grid;place-items:center;border:4px solid var(--ink);border-radius:22px 22px 42px 42px;color:white;font-size:clamp(25px,4vw,40px);font-weight:900;box-shadow:inset 0 12px 0 #ffffff45,0 7px 0 var(--ink)}.tube:nth-child(1){background:var(--blue)}.tube:nth-child(2){background:var(--coral)}.tube:nth-child(3){background:#edaa12}.tube.pick{transform:translateY(-9px) rotate(-2deg);outline:8px solid var(--yellow)}.tube.spin{animation:shake .18s linear infinite alternate}@keyframes shake{to{transform:rotate(2deg) translateY(3px)}}#result{min-height:105px;display:grid;place-items:center;padding:14px;border:3px dashed #83cbd1;border-radius:24px;background:#dff7f8;text-align:center}#result b{display:block;font-size:clamp(30px,5vw,48px)}button{width:100%;margin-top:18px;padding:18px;border:3px solid var(--ink);border-radius:18px;background:var(--yellow);box-shadow:0 7px 0 var(--ink);color:var(--ink);font:900 21px inherit;cursor:pointer}button:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ink)}aside{margin-top:26px;padding-top:18px;border-top:2px solid #d6e2e7;line-height:1.5}aside b{color:#087b86}@media(max-width:550px){body{padding:10px}main{padding:22px 15px}.tubes{gap:8px}.tube{min-height:115px;border-width:3px}.num{width:50px;height:50px}}
</style></head><body><main><header><span class="num">22</span><div><p>Hotel Hallo · spelletje</p><h1>De woordkoker</h1></div></header><p class="intro">Rol met de woordkoker. Maak daarna een vraag met het woord dat verschijnt.</p><div class="tubes"><div class="tube">Wie?</div><div class="tube">Wat?</div><div class="tube">Waar?</div></div><div id="result" aria-live="polite"><span><b>Klaar om te rollen?</b>Klik op de knop.</span></div><button id="roll">Rol de woordkoker</button><aside><b>Voorbeeld</b><br>Je rolt <strong>Wat?</strong> Wijs naar een stoel en vraag: “Wat is dat?”</aside></main><script>
const choices=[['Wie?','Kies een persoon en stel een vraag.'],['Wat?','Wijs iets aan en vraag: Wat is dat?'],['Waar?','Kies een plek en stel een vraag.']],tubes=[...document.querySelectorAll('.tube')],button=document.querySelector('#roll'),result=document.querySelector('#result');button.onclick=()=>{button.disabled=true;result.innerHTML='<span><b>De kokers draaien…</b></span>';tubes.forEach(t=>t.className='tube spin');setTimeout(()=>{const n=Math.floor(Math.random()*3);tubes.forEach((t,i)=>t.className='tube'+(i===n?' pick':''));result.innerHTML=`<span><b>${choices[n][0]}</b>${choices[n][1]}</span>`;button.textContent='Rol nog een keer';button.disabled=false},650)};
</script></body></html>
