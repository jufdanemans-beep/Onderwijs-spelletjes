<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galgje — met eigen thema's</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF3E4;
    --paper:#FFFDF8;
    --ink:#2B2620;
    --teal:#1F6F6B;
    --teal-dark:#154B48;
    --coral:#F2794A;
    --coral-dark:#C85A2E;
    --mustard:#E8A63A;
    --plum:#7A4FA3;
    --line:#E4D8BF;
    --shadow: rgba(43,38,32,0.18);
    --green:#3C8F5C;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--cream);
    background-image:
      radial-gradient(circle at 8% 12%, rgba(242,121,74,0.10) 0, transparent 40%),
      radial-gradient(circle at 92% 85%, rgba(31,111,107,0.10) 0, transparent 42%);
    font-family:'Nunito', sans-serif;
    color:var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:32px 16px 60px;
  }
  h1{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:clamp(28px, 5vw, 42px);
    color:var(--teal-dark);
    margin:0 0 4px;
    text-align:center;
  }
  .subtitle{
    font-size:15px;
    color:#6b6455;
    margin:0 0 24px;
    text-align:center;
    max-width:520px;
  }

  .layout{
    width:100%;
    max-width:560px;
    display:flex;
    flex-direction:column;
    gap:22px;
  }

  .panel{
    background:var(--paper);
    border:3px solid var(--line);
    border-radius:20px;
    padding:20px 22px;
  }
  .panel h2{
    font-family:'Baloo 2', sans-serif;
    font-size:18px;
    color:var(--teal-dark);
    margin:0 0 14px;
  }

  /* ---------- THEME BEHEER ---------- */
  .theme-row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
    margin-bottom:14px;
  }
  select, input[type="text"]{
    font-family:'Nunito', sans-serif;
    font-size:15px;
    border:2px solid var(--line);
    border-radius:12px;
    padding:9px 12px;
    background:var(--paper);
    color:var(--ink);
  }
  select#theme-select{ flex:1; min-width:160px; }
  input[type="text"]{ flex:1; min-width:120px; }

  button{
    font-family:'Baloo 2', sans-serif;
    font-size:15px;
    border:none;
    border-radius:14px;
    padding:10px 18px;
    cursor:pointer;
    box-shadow:0 4px 0 0 rgba(0,0,0,0.15);
    transition:transform .08s ease;
    white-space:nowrap;
  }
  button:active{ transform:translateY(3px); box-shadow:0 1px 0 0 rgba(0,0,0,0.15); }
  .btn-primary{ background:var(--coral); color:#fff; }
  .btn-secondary{ background:var(--teal); color:#fff; }
  .btn-ghost{ background:var(--paper); color:var(--teal-dark); border:2px solid var(--line); box-shadow:none; }
  .btn-ghost:active{ transform:none; }
  .btn-danger{ background:transparent; color:#a44; border:2px solid #e7c9c9; box-shadow:none; padding:6px 12px; font-size:14px; }
  .btn-danger:active{ transform:none; }

  .word-list{
    display:flex; flex-wrap:wrap; gap:8px; margin-top:12px;
  }
  .word-chip{
    display:flex; align-items:center; gap:6px;
    background:var(--cream);
    border:2px solid var(--line);
    border-radius:20px;
    padding:5px 6px 5px 12px;
    font-size:14px;
  }
  .word-chip button{
    padding:2px 8px; font-size:13px; border-radius:10px;
    background:transparent; color:#a44; box-shadow:none;
  }
  .word-chip button:active{ transform:none; }
  .empty-msg{ font-size:14px; color:#9a9284; font-style:italic; }

  /* ---------- SPEELVELD ---------- */
  .game-panel{ text-align:center; }
  .hangman-drawing{ margin:0 auto 12px; display:block; }
  .word-display{
    font-family:'Baloo 2', sans-serif;
    font-size:clamp(24px, 6vw, 34px);
    letter-spacing:8px;
    color:var(--teal-dark);
    margin:14px 0;
    word-break:break-all;
  }
  .status-msg{
    font-family:'Baloo 2', sans-serif;
    font-size:18px;
    min-height:26px;
    margin-bottom:10px;
  }
  .status-msg.win{ color:var(--green); }
  .status-msg.lose{ color:var(--coral-dark); }

  .keyboard{
    display:grid;
    grid-template-columns:repeat(7, 1fr);
    gap:6px;
    max-width:460px;
    margin:16px auto 0;
  }
  .key{
    font-family:'Baloo 2', sans-serif;
    font-size:16px;
    padding:10px 0;
    border-radius:10px;
    border:2px solid var(--line);
    background:var(--paper);
    color:var(--ink);
    cursor:pointer;
    box-shadow:none;
  }
  .key:active{ transform:translateY(1px); }
  .key.correct{ background:var(--green); border-color:var(--green); color:#fff; }
  .key.wrong{ background:var(--coral-dark); border-color:var(--coral-dark); color:#fff; opacity:.7; }
  .key:disabled{ cursor:default; }

  .controls-row{
    display:flex; gap:12px; justify-content:center; margin-top:18px; flex-wrap:wrap;
  }

  .lives-count{
    font-size:14px; color:#6b6455; margin-bottom:4px;
  }
</style>
</head>
<body>

<h1>Galgje</h1>
<p class="subtitle">Kies of maak een thema, voeg je eigen woorden toe, en speel. Woorden worden onthouden op deze computer.</p>

<div class="layout">

  <div class="panel">
    <h2>Thema beheren</h2>
    <div class="theme-row">
      <select id="theme-select"></select>
      <button class="btn-danger" id="delete-theme-btn">Verwijder thema</button>
    </div>
    <div class="theme-row">
      <input type="text" id="new-theme-input" placeholder="Naam van nieuw thema, bv. kerst">
      <button class="btn-secondary" id="add-theme-btn">Thema toevoegen</button>
    </div>

    <h2 style="margin-top:18px;">Woorden in dit thema</h2>
    <div class="theme-row">
      <input type="text" id="new-word-input" placeholder="Nieuw woord toevoegen">
      <button class="btn-secondary" id="add-word-btn">Toevoegen</button>
    </div>
    <div class="word-list" id="word-list"></div>
  </div>

  <div class="panel game-panel">
    <h2>Spelen</h2>
    <div class="lives-count" id="lives-count">6 levens over</div>
    <svg class="hangman-drawing" id="hangman-svg" width="180" height="200" viewBox="0 0 180 200">
      <line x1="20" y1="190" x2="120" y2="190" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>
      <line x1="45" y1="190" x2="45" y2="20" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>
      <line x1="45" y1="20" x2="120" y2="20" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>
      <line x1="120" y1="20" x2="120" y2="42" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>
      <circle id="hm-head" cx="120" cy="58" r="16" fill="none" stroke="var(--coral-dark)" stroke-width="4" opacity="0"/>
      <line id="hm-body" x1="120" y1="74" x2="120" y2="120" stroke="var(--coral-dark)" stroke-width="4" stroke-linecap="round" opacity="0"/>
      <line id="hm-arm-l" x1="120" y1="86" x2="100" y2="110" stroke="var(--coral-dark)" stroke-width="4" stroke-linecap="round" opacity="0"/>
      <line id="hm-arm-r" x1="120" y1="86" x2="140" y2="110" stroke="var(--coral-dark)" stroke-width="4" stroke-linecap="round" opacity="0"/>
      <line id="hm-leg-l" x1="120" y1="120" x2="102" y2="150" stroke="var(--coral-dark)" stroke-width="4" stroke-linecap="round" opacity="0"/>
      <line id="hm-leg-r" x1="120" y1="120" x2="138" y2="150" stroke="var(--coral-dark)" stroke-width="4" stroke-linecap="round" opacity="0"/>
    </svg>

    <div class="status-msg" id="status-msg"></div>
    <div class="word-display" id="word-display">_ _ _ _</div>
    <div class="keyboard" id="keyboard"></div>

    <div class="controls-row">
      <button class="btn-primary" id="new-word-btn">Nieuw woord</button>
    </div>
  </div>

</div>

<script>
  const STORAGE_KEY = "galgje-themas-v1";

  const defaultThemes = {
    "dieren": ["OLIFANT","GIRAF","KROKODIL","PINGUIN","KANGOEROE","VLINDER","EGEL"],
    "fruit": ["APPEL","BANAAN","AARDBEI","ANANAS","MANGO","KIWI","DRUIF"],
    "beroepen": ["BAKKER","DOKTER","BRANDWEER","TIMMERMAN","JUF","MEESTER","KAPPER"]
  };

  function loadThemes(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    }catch(e){}
    return JSON.parse(JSON.stringify(defaultThemes));
  }

  function saveThemes(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(themes));
    }catch(e){}
  }

  let themes = loadThemes();
  let currentTheme = Object.keys(themes)[0];

  const themeSelect = document.getElementById("theme-select");
  const newThemeInput = document.getElementById("new-theme-input");
  const addThemeBtn = document.getElementById("add-theme-btn");
  const deleteThemeBtn = document.getElementById("delete-theme-btn");
  const newWordInput = document.getElementById("new-word-input");
  const addWordBtn = document.getElementById("add-word-btn");
  const wordListEl = document.getElementById("word-list");

  const wordDisplay = document.getElementById("word-display");
  const statusMsg = document.getElementById("status-msg");
  const keyboardEl = document.getElementById("keyboard");
  const newWordBtn = document.getElementById("new-word-btn");
  const livesCount = document.getElementById("lives-count");

  const hangmanParts = ["hm-head","hm-body","hm-arm-l","hm-arm-r","hm-leg-l","hm-leg-r"];
  const MAX_WRONG = hangmanParts.length;

  function renderThemeSelect(){
    themeSelect.innerHTML = "";
    Object.keys(themes).forEach(name=>{
      const opt = document.createElement("option");
      opt.value = name;
      opt.textContent = `${name} (${themes[name].length})`;
      themeSelect.appendChild(opt);
    });
    themeSelect.value = currentTheme;
  }

  function renderWordList(){
    wordListEl.innerHTML = "";
    const words = themes[currentTheme] || [];
    if (words.length === 0){
      const p = document.createElement("div");
      p.className = "empty-msg";
      p.textContent = "Nog geen woorden in dit thema. Voeg er hierboven een toe.";
      wordListEl.appendChild(p);
      return;
    }
    words.forEach((w, idx)=>{
      const chip = document.createElement("div");
      chip.className = "word-chip";
      chip.innerHTML = `<span>${w}</span>`;
      const delBtn = document.createElement("button");
      delBtn.textContent = "×";
      delBtn.addEventListener("click", ()=>{
        themes[currentTheme].splice(idx,1);
        saveThemes();
        renderThemeSelect();
        renderWordList();
      });
      chip.appendChild(delBtn);
      wordListEl.appendChild(chip);
    });
  }

  themeSelect.addEventListener("change", ()=>{
    currentTheme = themeSelect.value;
    renderWordList();
  });

  addThemeBtn.addEventListener("click", ()=>{
    const name = newThemeInput.value.trim();
    if (!name) return;
    if (themes[name]){
      alert("Dit thema bestaat al.");
      return;
    }
    themes[name] = [];
    currentTheme = name;
    newThemeInput.value = "";
    saveThemes();
    renderThemeSelect();
    renderWordList();
  });

  deleteThemeBtn.addEventListener("click", ()=>{
    const names = Object.keys(themes);
    if (names.length <= 1){
      alert("Je moet minimaal één thema laten staan.");
      return;
    }
    if (!confirm(`Thema "${currentTheme}" verwijderen inclusief alle woorden?`)) return;
    delete themes[currentTheme];
    currentTheme = Object.keys(themes)[0];
    saveThemes();
    renderThemeSelect();
    renderWordList();
  });

  addWordBtn.addEventListener("click", ()=>{
    const word = newWordInput.value.trim().toUpperCase();
    if (!word) return;
    if (!/^[A-ZÀ-ÖØ-Þ\- ]+$/.test(word)){
      alert("Gebruik alleen letters.");
      return;
    }
    themes[currentTheme].push(word);
    newWordInput.value = "";
    saveThemes();
    renderThemeSelect();
    renderWordList();
  });
  newWordInput.addEventListener("keydown", (e)=>{
    if (e.key === "Enter") addWordBtn.click();
  });

  // ---------- GAME LOGIC ----------
  let secretWord = "";
  let guessed = new Set();
  let wrongCount = 0;
  let gameOver = false;

  const DUTCH_ALPHABET = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");

  function buildKeyboard(){
    keyboardEl.innerHTML = "";
    DUTCH_ALPHABET.forEach(letter=>{
      const btn = document.createElement("button");
      btn.className = "key";
      btn.textContent = letter;
      btn.addEventListener("click", ()=>handleGuess(letter));
      keyboardEl.appendChild(btn);
    });
  }

  function pickWord(){
    const pool = themes[currentTheme] || [];
    if (pool.length === 0) return null;
    return pool[Math.floor(Math.random() * pool.length)];
  }

  function updateHangmanDrawing(){
    hangmanParts.forEach((id, idx)=>{
      document.getElementById(id).style.opacity = idx < wrongCount ? "1" : "0";
    });
  }

  function updateWordDisplay(){
    const rendered = secretWord.split("").map(ch=>{
      if (ch === " " || ch === "-") return ch;
      return guessed.has(ch) ? ch : "_";
    }).join(" ");
    wordDisplay.textContent = rendered;
  }

  function updateLives(){
    const left = MAX_WRONG - wrongCount;
    livesCount.textContent = left > 0 ? `${left} levens over` : "0 levens over";
  }

  function checkGameEnd(){
    const allGuessed = secretWord.split("").every(ch => ch === " " || ch === "-" || guessed.has(ch));
    if (allGuessed){
      gameOver = true;
      statusMsg.textContent = "Gewonnen! 🎉";
      statusMsg.className = "status-msg win";
      disableKeyboard();
    } else if (wrongCount >= MAX_WRONG){
      gameOver = true;
      statusMsg.textContent = `Helaas! Het woord was: ${secretWord}`;
      statusMsg.className = "status-msg lose";
      disableKeyboard();
    }
  }

  function disableKeyboard(){
    keyboardEl.querySelectorAll("button").forEach(b => b.disabled = true);
  }

  function handleGuess(letter){
    if (gameOver) return;
    const btn = [...keyboardEl.children].find(b => b.textContent === letter);
    if (btn && btn.disabled) return;
    guessed.add(letter);
    if (btn) btn.disabled = true;

    if (secretWord.includes(letter)){
      if (btn) btn.classList.add("correct");
    } else {
      if (btn) btn.classList.add("wrong");
      wrongCount++;
      updateHangmanDrawing();
      updateLives();
    }
    updateWordDisplay();
    checkGameEnd();
  }

  function newGame(){
    const word = pickWord();
    if (!word){
      wordDisplay.textContent = "Voeg eerst woorden toe aan dit thema";
      statusMsg.textContent = "";
      buildKeyboard();
      disableKeyboard();
      return;
    }
    secretWord = word;
    guessed = new Set();
    wrongCount = 0;
    gameOver = false;
    statusMsg.textContent = "";
    statusMsg.className = "status-msg";
    updateHangmanDrawing();
    updateLives();
    updateWordDisplay();
    buildKeyboard();
  }

  newWordBtn.addEventListener("click", newGame);

  document.addEventListener("keydown", (e)=>{
    const letter = e.key.toUpperCase();
    if (DUTCH_ALPHABET.includes(letter)) handleGuess(letter);
  });

  // init
  renderThemeSelect();
  renderWordList();
  newGame();
</script>
</body>
</html>
