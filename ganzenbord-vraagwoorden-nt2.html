<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vraagwoordenrace - NT2</title>
  <style>
    :root{--ink:#17324d;--paper:#fffdf7;--shadow:0 12px 30px #17324d22;--who:#ffd93d;--what:#ffad7a;--where:#65b5e8;--when:#b96ac9;--time:#78bd55;--many:#ff5c5c}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:Trebuchet MS,Arial,sans-serif;background:radial-gradient(circle at 8% 12%,#fff3b8 0 7%,transparent 28%),radial-gradient(circle at 90% 85%,#cceeff 0 6%,transparent 30%),#f5f0e7}
    button{font:inherit}.app{width:min(1400px,100%);margin:auto;padding:18px}.top{display:flex;gap:16px;justify-content:space-between;align-items:center;margin-bottom:14px}.brand h1{margin:0;font-size:clamp(1.7rem,4vw,3rem)}.brand p{margin:4px 0 0;font-weight:700;color:#52708a}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.small-btn{border:2px solid var(--ink);border-radius:14px;background:white;padding:9px 13px;font-weight:800;cursor:pointer;box-shadow:0 3px 0 var(--ink)}.small-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
    .layout{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(285px,.8fr);gap:18px}.board-wrap,.panel{background:#ffffffcc;border:3px solid white;border-radius:24px;box-shadow:var(--shadow)}.board-wrap{padding:14px}.board{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}.tile{position:relative;aspect-ratio:1.18;border-radius:15px;border:2px solid #17324d55;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4px;min-width:0;box-shadow:inset 0 -5px 0 #17324d18}.tile .num{position:absolute;top:5px;left:7px;font-size:.72rem;font-weight:900;opacity:.65}.tile .icon{font-size:clamp(1.15rem,2.6vw,2.15rem);line-height:1}.tile .label{font-size:clamp(.55rem,1.2vw,.94rem);font-weight:900;text-transform:uppercase;margin-top:3px}.start,.finish{background:white}.start{background:linear-gradient(135deg,#fff,#d8f5ff)}.finish{background:linear-gradient(135deg,#fff,#fff2a8)}.who{background:var(--who)}.what{background:var(--what)}.where{background:var(--where)}.when{background:var(--when);color:white}.time{background:var(--time)}.many{background:var(--many);color:white}.pawns{position:absolute;right:3px;bottom:3px;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:2px;max-width:72%}.pawn{width:clamp(16px,2vw,25px);height:clamp(16px,2vw,25px);border-radius:50% 50% 45% 45%;border:2px solid white;box-shadow:0 1px 4px #0007;color:white;font-size:.7rem;font-weight:900;display:grid;place-items:center}
    .panel{padding:18px;display:flex;flex-direction:column;gap:13px}.turn-card{border-radius:18px;background:#e9f7ff;padding:13px;border:2px solid #b7def4}.turn-label{font-size:.8rem;text-transform:uppercase;font-weight:900;color:#52708a}.turn-name{font-size:1.45rem;font-weight:900}.players{display:flex;gap:6px;flex-wrap:wrap}.player-chip{border-radius:99px;padding:6px 10px;color:white;font-weight:900;border:2px solid white;box-shadow:0 1px 4px #0004;opacity:.55}.player-chip.active{opacity:1;outline:3px solid var(--ink)}
    .dice-area{text-align:center}.die{width:100px;height:100px;margin:2px auto 11px;border-radius:22px;border:3px solid var(--ink);background:white;display:grid;place-items:center;font-size:4rem;box-shadow:0 7px 0 #b9cad8;transition:.16s}.die.rolling{transform:rotate(8deg) scale(.95)}.roll{width:100%;border:0;border-radius:15px;background:#17324d;color:white;font-weight:900;font-size:1.18rem;padding:13px;cursor:pointer;box-shadow:0 5px 0 #071d30}.roll:disabled{opacity:.45;cursor:not-allowed}.roll:not(:disabled):active{transform:translateY(3px);box-shadow:0 2px 0 #071d30}
    .question{border-radius:19px;border:3px solid var(--ink);background:white;padding:16px;min-height:190px;display:none}.question.show{display:block}.q-type{font-weight:900;text-transform:uppercase;font-size:.9rem}.q-text{font-size:1.45rem;font-weight:900;margin:10px 0}.starter{background:#f2f6f8;border-radius:12px;padding:10px;font-size:1rem}.starter b{display:block;font-size:.75rem;text-transform:uppercase;color:#52708a;margin-bottom:2px}.q-actions{display:flex;gap:7px;margin-top:12px}.q-actions button{flex:1;border:2px solid var(--ink);border-radius:12px;background:white;padding:9px;font-weight:900;cursor:pointer}.q-actions .done{background:#9bea7f}.hint{display:none;margin-top:9px;padding:8px;border-radius:10px;background:#fff6c7}.hint.show{display:block}.rules{font-size:.88rem;background:#fff7df;border-radius:14px;padding:10px}.rules b{display:block;margin-bottom:3px}.setup{position:fixed;inset:0;background:#17324de8;display:grid;place-items:center;padding:16px;z-index:5}.setup.hidden{display:none}.setup-card{width:min(510px,100%);background:var(--paper);border-radius:25px;padding:25px;box-shadow:var(--shadow)}.setup-card h2{font-size:2rem;margin:0 0 6px}.setup-card p{margin-top:0}.player-inputs{display:grid;gap:9px;margin:18px 0}.player-row{display:grid;grid-template-columns:35px 1fr;gap:8px;align-items:center}.dot{width:29px;height:29px;border-radius:50%}.player-row input{width:100%;border:2px solid #b8c7d1;border-radius:11px;padding:10px;font:inherit;font-weight:700}.start-btn{width:100%;border:0;border-radius:14px;padding:13px;background:#ffcb3d;color:var(--ink);font-size:1.1rem;font-weight:900;cursor:pointer;box-shadow:0 5px 0 #d79a00}.status{text-align:center;font-weight:800;color:#52708a;min-height:1.2em}
    @media(max-width:850px){.top{align-items:flex-start}.layout{grid-template-columns:1fr}.board{gap:4px}.tile{border-radius:9px}.tile .label{display:none}.panel{display:grid;grid-template-columns:1fr 1fr}.turn-card,.players,.rules,.status{grid-column:1/-1}.question{grid-column:1/-1}.die{width:80px;height:80px;font-size:3rem}.q-text{font-size:1.25rem}}@media(max-width:520px){.app{padding:8px}.brand p{display:none}.small-btn{padding:7px}.board-wrap{padding:6px}.tile{border-width:1px}.tile .num{font-size:.52rem;top:2px;left:3px}.panel{grid-template-columns:1fr}.question,.turn-card,.players,.rules,.status{grid-column:auto}}
  </style>
</head>
<body>
<div class="app">
  <header class="top"><div class="brand"><h1>🎲 Vraagwoordenrace</h1><p>Een spreekspel voor NT2-leerlingen</p></div><div class="toolbar"><button class="small-btn" id="soundBtn">🔊 Geluid aan</button><button class="small-btn" id="newBtn">↻ Nieuw spel</button></div></header>
  <main class="layout">
    <section class="board-wrap"><div class="board" id="board" aria-label="Spelbord"></div></section>
    <aside class="panel">
      <div class="turn-card"><div class="turn-label">Aan de beurt</div><div class="turn-name" id="turnName">-</div></div>
      <div class="players" id="players"></div>
      <div class="dice-area"><div class="die" id="die" aria-live="polite">⚀</div><button class="roll" id="rollBtn">Gooi de dobbelsteen</button></div>
      <div class="question" id="question"><div class="q-type" id="qType"></div><div class="q-text" id="qText"></div><div class="starter"><b>Zinsstarter</b><span id="starter"></span></div><div class="hint" id="hint"></div><div class="q-actions"><button id="listenBtn">🔊 Luister</button><button id="hintBtn">💡 Hulp</button><button class="done" id="doneBtn">✓ Klaar</button></div></div>
      <div class="status" id="status">Gooi om te beginnen!</div>
      <div class="rules"><b>Zo speel je</b>Gooi, verplaats je pion en beantwoord de vraag hardop. Bij het einde moet je precies uitkomen.</div>
    </aside>
  </main>
</div>
<div class="setup" id="setup"><div class="setup-card"><h2>Wie doen er mee?</h2><p>Vul 2 tot 4 namen in.</p><div class="player-inputs" id="playerInputs"></div><button class="start-btn" id="startBtn">Start het spel →</button></div></div>
<script>
const colors=['#ef476f','#118ab2','#06a77d','#7b5cff'];
const types=[
 {key:'who',label:'Wie?',icon:'🙂',starter:'Dat is …',questions:[['Wie is jouw juf of meester?','Noem de naam van je juf of meester.'],['Wie woont er bij jou thuis?','Noem één of meer personen.'],['Wie is jouw vriend of vriendin?','Zeg: Mijn vriend(in) is …'],['Wie helpt jou als iets moeilijk is?','Denk aan thuis of school.'],['Wie zit er vandaag naast jou?','Kijk om je heen.']]},
 {key:'what',label:'Wat?',icon:'🎒',starter:'Ik … / Dat is …',questions:[['Wat eet je graag?','Noem iets dat je lekker vindt.'],['Wat doe je na school?','Begin met: Na school …'],['Wat zit er in jouw tas?','Noem minstens twee dingen.'],['Wat is jouw lievelingskleur?','Zeg: Mijn lievelingskleur is …'],['Wat zie je voor je?','Kijk goed en noem iets.']]},
 {key:'where',label:'Waar?',icon:'🏠',starter:'In / Op / Bij …',questions:[['Waar woon je?','Noem je woonplaats of land.'],['Waar leer je Nederlands?','Bijvoorbeeld: op school, thuis of online.'],['Waar ligt jouw telefoon?','Gebruik op, onder, naast of in.'],['Waar koop je brood?','Denk aan een winkel.'],['Waar speel je graag?','Begin met: Ik speel graag …']]},
 {key:'when',label:'Wanneer?',icon:'📅',starter:'Op / Om / In …',questions:[['Wanneer ben je jarig?','Noem de dag of maand.'],['Wanneer ga je naar school?','Noem een dag of dagdeel.'],['Wanneer eet je ontbijt?','Bijvoorbeeld: in de ochtend.'],['Wanneer heb je vakantie?','Noem een maand of seizoen.'],['Wanneer ga je slapen?','Je mag een tijd noemen.']]},
 {key:'time',label:'Hoe laat?',icon:'🕒',starter:'Om … uur.',questions:[['Hoe laat begint school?','Antwoord met een tijd.'],['Hoe laat sta je op?','Antwoord: Om … uur.'],['Hoe laat eet je avondeten?','Een schatting is goed.'],['Hoe laat is het nu?','Kijk op de klok.','Het is … uur.'],['Hoe laat ga je naar bed?','Antwoord met een tijd.']]},
 {key:'many',label:'Hoeveel?',icon:'🔢',starter:'Ik heb / Er zijn …',questions:[['Hoeveel jaar ben je?','Zeg: Ik ben … jaar.'],['Hoeveel mensen wonen bij jou thuis?','Tel alle mensen.'],['Hoeveel talen spreek je?','Noem daarna de talen.'],['Hoeveel dagen heeft een week?','Denk aan maandag tot en met zondag.'],['Hoeveel vingers heb je?','Tel je vingers.']]}
];
const path=[null,...Array.from({length:34},(_,i)=>types[i%6]),{key:'finish',label:'Einde',icon:'🏆'}];
let players=[],turn=0,waiting=false,sound=true;
const $=id=>document.getElementById(id), diceChars=['⚀','⚁','⚂','⚃','⚄','⚅'];
function makeSetup(){ $('playerInputs').innerHTML=colors.map((c,i)=>`<label class="player-row"><span class="dot" style="background:${c}"></span><input maxlength="16" value="${i<2?'Speler '+(i+1):''}" placeholder="Speler ${i+1}"></label>`).join(''); }
function tileOrder(i){const row=Math.floor(i/6),col=i%6;return row%2?row*6+(5-col):i}
function drawBoard(){const cells=Array(36);path.forEach((t,i)=>{const pos=tileOrder(i);cells[pos]=`<div class="tile ${t?t.key:'start'}" data-index="${i}"><span class="num">${i||''}</span><span class="icon">${t?t.icon:'🚩'}</span><span class="label">${t?t.label:'Start'}</span><span class="pawns"></span></div>`});$('board').innerHTML=cells.join('');drawPawns()}
function drawPawns(){document.querySelectorAll('.pawns').forEach(x=>x.innerHTML='');players.forEach((p,i)=>{const slot=document.querySelector(`[data-index="${p.pos}"] .pawns`);if(slot)slot.insertAdjacentHTML('beforeend',`<span class="pawn" style="background:${p.color}" title="${p.name}">${i+1}</span>`)})}
function drawPlayers(){$('players').innerHTML=players.map((p,i)=>`<span class="player-chip ${i===turn?'active':''}" style="background:${p.color}">${p.name}</span>`).join('');$('turnName').textContent=players[turn]?.name||'-'}
function speak(text){if(sound&&'speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='nl-NL';u.rate=.82;speechSynthesis.speak(u)}}
function startGame(){const names=[...document.querySelectorAll('.player-row input')].map(x=>x.value.trim()).filter(Boolean);if(names.length<2){alert('Vul minimaal 2 namen in.');return}players=names.map((name,i)=>({name,color:colors[i],pos:0}));turn=0;waiting=false;$('setup').classList.add('hidden');$('question').classList.remove('show');$('rollBtn').disabled=false;drawBoard();drawPlayers();$('status').textContent='Gooi om te beginnen!'}
function roll(){if(waiting)return;const n=1+Math.floor(Math.random()*6);$('rollBtn').disabled=true;$('die').classList.add('rolling');let ticks=0;const spin=setInterval(()=>{$('die').textContent=diceChars[Math.floor(Math.random()*6)];if(++ticks>7){clearInterval(spin);$('die').textContent=diceChars[n-1];$('die').classList.remove('rolling');move(n)}},70)}
function move(n){const p=players[turn],target=p.pos+n;if(target>35){$('status').textContent=`Je hebt precies ${35-p.pos} nodig. Je blijft staan.`;setTimeout(nextTurn,900);return}p.pos=target;drawPawns();if(target===35){$('status').textContent=`🎉 ${p.name} heeft gewonnen!`;$('turnName').textContent='Gewonnen!';$('rollBtn').disabled=true;speak(`${p.name} heeft gewonnen!`);return}showQuestion(path[target])}
function showQuestion(t){waiting=true;const q=t.questions[Math.floor(Math.random()*t.questions.length)];$('qType').textContent=`${t.icon} ${t.label}`;$('qType').style.color=getComputedStyle(document.documentElement).getPropertyValue('--'+t.key);$('qText').textContent=q[0];$('starter').textContent=q[2]||t.starter;$('hint').textContent=q[1];$('hint').classList.remove('show');$('question').classList.add('show');$('status').textContent='Geef antwoord in een hele zin.';speak(q[0])}
function nextTurn(){waiting=false;$('question').classList.remove('show');turn=(turn+1)%players.length;drawPlayers();$('rollBtn').disabled=false;$('status').textContent='De volgende speler mag gooien.'}
$('rollBtn').onclick=roll;$('doneBtn').onclick=nextTurn;$('listenBtn').onclick=()=>speak($('qText').textContent);$('hintBtn').onclick=()=>$('hint').classList.toggle('show');$('startBtn').onclick=startGame;$('newBtn').onclick=()=>{makeSetup();$('setup').classList.remove('hidden')};$('soundBtn').onclick=()=>{sound=!sound;$('soundBtn').textContent=sound?'🔊 Geluid aan':'🔇 Geluid uit'};
makeSetup();drawBoard();
</script>
</body>
</html>
