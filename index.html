<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mijn Onderwijsspelletjes</title>
<style>
  :root {
    --cream: #FBF1E4;
    --terracotta: #D97B4F;
    --rust: #B5512E;
    --mustard: #E8A23D;
    --brown: #5B3A29;
    --card-bg: #FFFFFF;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    font-family: 'Trebuchet MS', 'Segoe UI', Verdana, sans-serif;
    background:
      radial-gradient(circle at 10% 10%, rgba(232,162,61,0.25), transparent 40%),
      radial-gradient(circle at 90% 80%, rgba(217,123,79,0.25), transparent 40%),
      var(--cream);
    color: var(--brown);
    display: flex;
    justify-content: center;
    padding: 48px 20px;
  }

  main {
    width: 100%;
    max-width: 640px;
  }

  h1 {
    font-size: 2.2rem;
    text-align: center;
    color: var(--rust);
    margin-bottom: 8px;
    letter-spacing: 0.5px;
  }

  .subtitle {
    text-align: center;
    color: var(--brown);
    opacity: 0.7;
    margin-bottom: 36px;
    font-size: 1rem;
  }

  ul {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  li {
    background: var(--card-bg);
    border-radius: 14px;
    box-shadow: 0 3px 10px rgba(91, 58, 41, 0.12);
    border-left: 6px solid var(--mustard);
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
  }

  li:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 16px rgba(181, 81, 46, 0.25);
    border-left-color: var(--rust);
  }

  a {
    display: block;
    padding: 16px 20px;
    text-decoration: none;
    color: var(--brown);
    font-weight: 600;
    font-size: 1.05rem;
  }

  a:hover {
    color: var(--rust);
  }

  a::before {
    content: "🔥";
    margin-right: 10px;
    font-size: 0.9rem;
  }
</style>
</head>
<body>
<main>
  <h1>Mijn Onderwijsspelletjes</h1>
  <p class="subtitle">Klik op een spel om te starten</p>
  <ul>
    <li><a href="Spookwoordenboek Taaljacht Blok 1 groep 4.html">Spookwoordenboek Taaljacht Blok 1 groep 4</a></li>
    <li><a href="Spookwoordenboek Taaljacht Blok 8 groep 4.html">Spookwoordenboek Taaljacht Blok 8 groep 4</a></li>
    <li><a href="story-cubes.html">story-cubes</a></li>
    <li><a href="breinbreak.html">breinbreak</a></li>
  </ul>
</main>
</body>
</html>
