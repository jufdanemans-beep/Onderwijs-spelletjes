<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffd966">
  <title>Klankmemory – m en s</title>
  <style>
    :root {
      --ink: #263238;
      --blue: #1976d2;
      --blue-dark: #0d4e99;
      --red: #e53935;
      --yellow: #ffd54f;
      --yellow-light: #fff5bf;
      --cream: #fffdf2;
      --green: #46a66a;
      --card: #ffffff;
      --shadow: 0 12px 28px rgba(38, 50, 56, .15);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Trebuchet MS", "Arial Rounded MT Bold", Arial, sans-serif;
      background:
        radial-gradient(circle at 10% 12%, rgba(255, 213, 79, .42), transparent 22rem),
        radial-gradient(circle at 92% 85%, rgba(25, 118, 210, .12), transparent 24rem),
        var(--cream);
    }

    button { font: inherit; }

    .app {
      width: min(1120px, calc(100% - 28px));
      margin: 0 auto;
      padding: 22px 0 40px;
    }

    header {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 18px;
      padding: 16px 20px;
      border: 3px solid var(--ink);
      border-radius: 28px;
      background: rgba(255,255,255,.92);
      box-shadow: var(--shadow);
    }

    .bee {
      display: grid;
      width: 78px;
      height: 78px;
      place-items: center;
      border-radius: 50%;
      background: var(--yellow-light);
      font-size: 54px;
      line-height: 1;
      transform: rotate(-7deg);
    }

    h1 { margin: 0; font-size: clamp(1.6rem, 4vw, 2.6rem); color: var(--blue-dark); }
    .subtitle { margin: 5px 0 0; font-size: clamp(.95rem, 2vw, 1.15rem); }

    .sound-key {
      display: flex;
      gap: 7px;
      align-items: center;
      white-space: nowrap;
      font-weight: 800;
    }

    .sound-pill {
      display: inline-grid;
      min-width: 42px;
      min-height: 42px;
      place-items: center;
      padding: 6px 11px;
      border: 2px solid currentColor;
      border-radius: 14px;
      background: #fff;
      font-size: 1.35rem;
    }

    .sound-pill.m { color: var(--red); }
    .sound-pill.s { color: var(--blue); }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 18px 0;
      padding: 12px 16px;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 6px 18px rgba(38, 50, 56, .10);
    }

    .stats { display: flex; flex-wrap: wrap; gap: 9px; }
    .stat { padding: 9px 13px; border-radius: 14px; background: #eef7ff; font-weight: 800; }
    .stat strong { color: var(--blue-dark); }

    .actions { display: flex; flex-wrap: wrap; gap: 9px; }

    .btn {
      min-height: 44px;
      padding: 9px 15px;
      border: 2px solid var(--ink);
      border-radius: 14px;
      background: #fff;
      color: var(--ink);
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 3px 0 var(--ink);
      transition: transform .15s ease, box-shadow .15s ease;
    }

    .btn:hover { transform: translateY(-1px); box-shadow: 0 4px 0 var(--ink); }
    .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
    .btn.primary { background: var(--yellow); }
    .btn[aria-pressed="true"] { background: #dff3e6; }

    .instruction {
      margin: 0 0 16px;
      text-align: center;
      font-size: 1.05rem;
      font-weight: 800;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(6, minmax(120px, 1fr));
      gap: 14px;
      perspective: 1000px;
    }

    .memory-card {
      position: relative;
      aspect-ratio: 4 / 5;
      min-height: 150px;
      padding: 0;
      border: 0;
      border-radius: 22px;
      background: transparent;
      cursor: pointer;
      perspective: 900px;
    }

    .memory-card:focus-visible { outline: 5px solid #7b2cbf; outline-offset: 4px; }
    .card-inner { position: absolute; inset: 0; transition: transform .48s cubic-bezier(.2,.75,.25,1); transform-style: preserve-3d; }
    .memory-card.flipped .card-inner, .memory-card.matched .card-inner { transform: rotateY(180deg); }

    .card-face {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 3px solid var(--ink);
      border-radius: 22px;
      backface-visibility: hidden;
      box-shadow: var(--shadow);
    }

    .card-back {
      background:
        linear-gradient(135deg, transparent 44%, rgba(255,255,255,.28) 44% 56%, transparent 56%),
        var(--yellow);
      background-size: 26px 26px;
    }

    .card-back::after {
      content: "🐝";
      display: grid;
      width: 62%;
      aspect-ratio: 1;
      place-items: center;
      border: 3px solid var(--ink);
      border-radius: 50%;
      background: #fff;
      font-size: clamp(2rem, 5vw, 3.5rem);
      box-shadow: 0 5px 0 rgba(38,50,56,.16);
    }

    .card-front {
      grid-template-rows: 1fr auto;
      padding: 12px;
      background: var(--card);
      transform: rotateY(180deg);
    }

    .picture { align-self: center; font-size: clamp(3.2rem, 7vw, 5rem); filter: drop-shadow(0 5px 3px rgba(0,0,0,.12)); }
    .word { width: 100%; padding: 9px 6px 7px; border-top: 2px dashed #c7d3d7; font-size: clamp(1.4rem, 3vw, 2rem); font-weight: 900; letter-spacing: .02em; }
    .target-m { color: var(--red); }
    .target-s { color: var(--blue); }

    .memory-card.matched .card-face { border-color: var(--green); box-shadow: 0 0 0 5px rgba(70,166,106,.2), var(--shadow); }
    .memory-card.matched::after {
      content: "✓";
      position: absolute;
      z-index: 3;
      top: -8px;
      right: -8px;
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border: 3px solid var(--ink);
      border-radius: 50%;
      background: #6fd48d;
      font-size: 1.4rem;
      font-weight: 900;
    }

    .message {
      min-height: 72px;
      margin-top: 18px;
      padding: 15px 18px;
      border: 3px solid var(--ink);
      border-radius: 20px;
      background: #fff;
      text-align: center;
      font-size: 1.12rem;
      font-weight: 800;
      box-shadow: 0 5px 0 rgba(38,50,56,.12);
    }

    .message.success { background: #e4f8e9; }
    .letter-m { color: var(--red); }
    .letter-s { color: var(--blue); }

    .finish {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(38,50,56,.58);
    }

    .finish[hidden] { display: none; }
    .finish-box { width: min(520px, 100%); padding: 28px; border: 4px solid var(--ink); border-radius: 28px; background: var(--cream); text-align: center; box-shadow: 0 18px 50px rgba(0,0,0,.3); }
    .finish-box .big-bee { font-size: 5rem; }
    .finish-box h2 { margin: 5px 0 8px; color: var(--blue-dark); font-size: 2rem; }

    @media (max-width: 900px) {
      header { grid-template-columns: auto 1fr; }
      .sound-key { grid-column: 1 / -1; justify-content: center; }
      .board { grid-template-columns: repeat(4, minmax(105px, 1fr)); }
    }

    @media (max-width: 570px) {
      .app { width: min(100% - 16px, 1120px); padding-top: 8px; }
      header { grid-template-columns: 60px 1fr; padding: 12px; border-radius: 20px; }
      .bee { width: 58px; height: 58px; font-size: 41px; }
      .toolbar { align-items: stretch; }
      .stats, .actions { width: 100%; justify-content: center; }
      .board { grid-template-columns: repeat(3, minmax(88px, 1fr)); gap: 8px; }
      .memory-card { min-height: 130px; }
      .card-face { border-width: 2px; border-radius: 16px; }
      .picture { font-size: 3.1rem; }
      .word { font-size: 1.3rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="bee" aria-hidden="true">🐝</div>
      <div>
        <h1>Klankmemory</h1>
        <p class="subtitle">Zoek twee kaartjes met hetzelfde woord.</p>
      </div>
      <div class="sound-key" aria-label="Doelklanken">
        <span class="sound-pill m">m</span>
        <span>en</span>
        <span class="sound-pill s">s</span>
      </div>
    </header>

    <section class="toolbar" aria-label="Spelinformatie en knoppen">
      <div class="stats" aria-live="polite">
        <span class="stat">Pogingen: <strong id="moves">0</strong></span>
        <span class="stat">Paren: <strong id="matches">0</strong>/6</span>
      </div>
      <div class="actions">
        <button class="btn primary" id="restart" type="button">↻ Opnieuw</button>
      </div>
    </section>

    <p class="instruction">Draai twee kaartjes om. Zoek twee keer hetzelfde woord en benoem de <span class="letter-m">m</span> of <span class="letter-s">s</span>.</p>
    <section class="board" id="board" aria-label="Memoryspel met twaalf kaarten"></section>
    <div class="message" id="message" aria-live="polite">Kies je eerste kaartje.</div>
  </main>

  <div class="finish" id="finish" role="dialog" aria-modal="true" aria-labelledby="finishTitle" hidden>
    <div class="finish-box">
      <div class="big-bee" aria-hidden="true">🐝</div>
      <h2 id="finishTitle">Geweldig gezoemd!</h2>
      <p>Je hebt alle woorden met de klanken <strong class="letter-m">m</strong> en <strong class="letter-s">s</strong> gevonden.</p>
      <p>Je had <strong id="finalMoves">0</strong> pogingen nodig.</p>
      <button class="btn primary" id="playAgain" type="button">Nog een keer</button>
    </div>
  </div>

  <script>
    const cards = [
      { pair: 'maan', sound: 'm', word: 'maan', emoji: '🌙', html: '<span class="target-m">m</span>aan' },
      { pair: 'maan', sound: 'm', word: 'maan', emoji: '🌙', html: '<span class="target-m">m</span>aan' },
      { pair: 'mes',  sound: 'm', word: 'mes',  emoji: '🔪', html: '<span class="target-m">m</span>es' },
      { pair: 'mes',  sound: 'm', word: 'mes',  emoji: '🔪', html: '<span class="target-m">m</span>es' },
      { pair: 'mus',  sound: 'm', word: 'mus',  emoji: '🐦', html: '<span class="target-m">m</span>us' },
      { pair: 'mus',  sound: 'm', word: 'mus',  emoji: '🐦', html: '<span class="target-m">m</span>us' },
      { pair: 'sok',  sound: 's', word: 'sok',  emoji: '🧦', html: '<span class="target-s">s</span>ok' },
      { pair: 'sok',  sound: 's', word: 'sok',  emoji: '🧦', html: '<span class="target-s">s</span>ok' },
      { pair: 'sap',  sound: 's', word: 'sap',  emoji: '🧃', html: '<span class="target-s">s</span>ap' },
      { pair: 'sap',  sound: 's', word: 'sap',  emoji: '🧃', html: '<span class="target-s">s</span>ap' },
      { pair: 'soep', sound: 's', word: 'soep', emoji: '🍲', html: '<span class="target-s">s</span>oep' },
      { pair: 'soep', sound: 's', word: 'soep', emoji: '🍲', html: '<span class="target-s">s</span>oep' }
    ];

    const board = document.getElementById('board');
    const movesEl = document.getElementById('moves');
    const matchesEl = document.getElementById('matches');
    const message = document.getElementById('message');
    const finish = document.getElementById('finish');
    const finalMoves = document.getElementById('finalMoves');
    let first = null;
    let second = null;
    let locked = false;
    let moves = 0;
    let matches = 0;

    function shuffle(items) {
      const result = [...items];
      for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
      }
      return result;
    }

    function createCard(data, index) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'memory-card';
      button.dataset.pair = data.pair;
      button.dataset.sound = data.sound;
      button.dataset.word = data.word;
      button.setAttribute('aria-label', `Kaart ${index + 1}, omgedraaid`);
      button.innerHTML = `
        <span class="card-inner">
          <span class="card-face card-back" aria-hidden="true"></span>
          <span class="card-face card-front">
            <span class="picture" aria-hidden="true">${data.emoji}</span>
            <span class="word">${data.html}</span>
          </span>
        </span>`;
      button.addEventListener('click', () => flip(button));
      return button;
    }

    function flip(card) {
      if (locked || card === first || card.classList.contains('matched')) return;
      card.classList.add('flipped');
      card.setAttribute('aria-label', `${card.dataset.word}, klank ${card.dataset.sound}`);

      if (!first) {
        first = card;
        message.className = 'message';
        message.textContent = `${card.dataset.word} — kies nu het tweede kaartje.`;
        return;
      }

      second = card;
      moves++;
      movesEl.textContent = moves;
      checkPair();
    }

    function checkPair() {
      locked = true;
      const correct = first.dataset.pair === second.dataset.pair;
      if (correct) {
        const sound = first.dataset.sound;
        first.classList.add('matched');
        second.classList.add('matched');
        first.disabled = true;
        second.disabled = true;
        matches++;
        matchesEl.textContent = matches;
        message.className = 'message success';
        message.innerHTML = `Twee keer <strong>${first.dataset.word}</strong>: dat is een paar! Ik hoor <strong class="letter-${sound}">/${sound}/</strong>.`;
        resetTurn();
        if (matches === 6) setTimeout(showFinish, 900);
      } else {
        message.className = 'message';
        message.textContent = `${first.dataset.word} en ${second.dataset.word} horen niet bij elkaar. Probeer het nog eens.`;
        setTimeout(() => {
          [first, second].forEach(card => {
            card.classList.remove('flipped');
            card.setAttribute('aria-label', 'Omgedraaide kaart');
          });
          resetTurn();
          message.textContent = 'Kies je eerste kaartje.';
        }, 1250);
      }
    }

    function resetTurn() {
      first = null;
      second = null;
      locked = false;
    }

    function startGame() {
      board.innerHTML = '';
      shuffle(cards).forEach((card, index) => board.appendChild(createCard(card, index)));
      first = second = null;
      locked = false;
      moves = matches = 0;
      movesEl.textContent = '0';
      matchesEl.textContent = '0';
      message.className = 'message';
      message.textContent = 'Kies je eerste kaartje.';
      finish.hidden = true;
    }

    function showFinish() {
      finalMoves.textContent = moves;
      finish.hidden = false;
      document.getElementById('playAgain').focus();
    }

    document.getElementById('restart').addEventListener('click', startGame);
    document.getElementById('playAgain').addEventListener('click', startGame);
    startGame();
  </script>
</body>
</html>
