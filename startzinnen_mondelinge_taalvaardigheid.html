<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Startzinnen – mondelinge taalvaardigheid</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap");
:root{font-family:Montserrat,system-ui,-apple-system,Segoe UI,sans-serif;color:#22203a;background:#fbfaf6}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(105deg,#f06468 0 25%,#f6b84d 25% 50%,#bbfbb7 50% 75%,#88f2c0 75%);padding:22px max(4vw,20px);box-shadow:0 2px 14px #29204212}h1{margin:0;font-size:clamp(1.7rem,3vw,2.7rem)}header p{margin:6px 0 0;color:#282536}main{max-width:1450px;margin:auto;padding:24px max(3vw,18px) 42px}.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:20px}.toolbar label{font-weight:700}.toolbar button,.toolbar select,.toolbar input{font:inherit;border:1px solid #bbb6d0;background:white;border-radius:10px;padding:10px 13px}.toolbar button{cursor:pointer}.toolbar button:hover,.card:hover{filter:brightness(.97)}.toolbar button:focus-visible,.card:focus-visible,.sentence:focus-visible{outline:4px solid #4545d3;outline-offset:3px}.prompt{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:22px}.prompt input{flex:1;min-width:220px;font-size:1.1rem;padding:13px;border:2px solid #d5d1e5;border-radius:12px}.prompt label{font-weight:700}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.card{border:0;border-radius:17px;overflow:hidden;background:#fff;box-shadow:0 4px 18px #28203d14;text-align:left;cursor:pointer;color:inherit;padding:0;display:flex;flex-direction:column;min-height:165px}.card strong{display:block;background:var(--color);padding:15px 18px;font-size:1.23rem}.card span{padding:18px;line-height:1.35;font-size:1.17rem}.card small{display:block;margin:auto 18px 17px;color:#666077}.card.active{outline:4px solid #33239a;outline-offset:2px}.stage{margin-top:25px;background:#fff;border-radius:20px;box-shadow:0 4px 18px #28203d14;padding:24px;min-height:200px}.stage-heading{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.stage h2{font-size:1.25rem;margin:0}.sentence{font-size:clamp(2rem,4.5vw,4.6rem);font-weight:750;line-height:1.2;margin:24px 0;overflow-wrap:anywhere}.sentence em{font-style:normal;color:#655dc0}.stage-actions{display:flex;gap:10px;flex-wrap:wrap}.stage-actions button{font:inherit;font-weight:650;border:0;background:#eeeafb;color:#30216d;border-radius:11px;padding:12px 17px;cursor:pointer}.stage-actions button:disabled{opacity:.45;cursor:default}.hint{color:#625c72;margin:12px 0 0}.sr-only{position:absolute;clip:rect(0,0,0,0);width:1px;height:1px;overflow:hidden}@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:530px){.grid{grid-template-columns:1fr}.card{min-height:120px}.card span{padding:12px 18px}}@media print{header,.toolbar,.prompt,.grid,.stage-actions,.hint{display:none}.stage{box-shadow:none}.sentence{font-size:40pt}}
</style>
</head>
<body>
<header><h1>Startzinnen</h1><p>Kies een gespreksdoel. Maak de zin samen af en vertel verder.</p></header>
<main>
<div class="toolbar"><label for="level">Niveau</label><select id="level"><option value="nt2">NT2 / eenvoudig</option><option value="all">Alle startzinnen</option></select><button id="random">🎲 Willekeurige startzin</button><button id="full">⛶ Volledig scherm</button></div>
<div class="prompt"><label for="topic">Waarover praten we?</label><input id="topic" type="text" placeholder="Bijvoorbeeld: Wat gebeurt er in dit verhaal?" autocomplete="off"></div>
<div class="grid" id="cards" aria-label="Gespreksdoelen"></div>
<section class="stage" id="stage" aria-live="polite"><div class="stage-heading"><h2 id="selected">Kies hierboven een gespreksdoel</h2><span id="counter"></span></div><p class="sentence" id="sentence">Ik denk …</p><div class="stage-actions"><button id="previous" disabled>← Vorige</button><button id="next" disabled>Volgende startzin →</button><button id="repeat" disabled>👂 Luister</button></div><p class="hint">Tip: geef denktijd. Laat een leerling de zin afmaken en vraag daarna: “Waarom denk je dat?”</p></section>
</main>
<script>
const groups=[
{title:'Voorspelling',color:'#f6b84d',simple:['Ik denk dat …','Ik voorspel dat …','Ik denk dat het straks …'],extra:['Ik voorspel …','Ik voorspel dat … gaat gebeuren, want …','Ik denk dat ze hetzelfde zijn, want …','Het zijn allebei …']},
{title:'Mening',color:'#bbfbb7',simple:['Ik vind …','Ik vind dit leuk, want …','Ik denk dat …'],extra:['Ik vind dit het leukst, want …','Mijn maatje denkt …','Ik ben het ermee eens, omdat …','Ik ben het er niet mee eens, omdat …','Ik vind dit de beste oplossing, want …']},
{title:'Conclusie',color:'#88f2c0',simple:['Dus ik denk dat …','Ik heb ontdekt dat …','Nu weet ik dat …'],extra:['We zagen dat … gebeurde, omdat …','Eerst dacht ik …, maar nu weet ik …']},
{title:'Evaluatie',color:'#f06468',simple:['Ik vond het leuk, want …','Ik vond het moeilijk, want …','Volgende keer wil ik …'],extra:['Ik vond het gemakkelijk/moeilijk, want …','Ik denk dat we de volgende keer beter … kunnen doen','Volgende keer ga ik …','Het was interessant, omdat …','Ik vond vooral leuk dat …, omdat …']},
{title:'Vergelijking',color:'#ffc8a2',simple:['Dit is hetzelfde als …','Dit is anders dan …','Ze zijn allebei …'],extra:['Het is hetzelfde, omdat …','Het is anders, omdat …','Die dingen zien er hetzelfde uit, want het zijn allebei …','Die zijn hetzelfde, want …']},
{title:'Argument',color:'#d7d0ff',simple:['Ja, want …','Nee, want …','Ik denk dat …, want …'],extra:['Dat klopt …','Dat klopt niet …','Ik ben het er (niet) mee eens, want …','Echter …']}
];
const cards=document.querySelector('#cards'),level=document.querySelector('#level'),sentence=document.querySelector('#sentence');let active=-1,index=0;
function phrases(i){const g=groups[i];return level.value==='nt2'?g.simple:[...g.simple,...g.extra.filter(x=>!g.simple.includes(x))]}
function renderCards(){cards.innerHTML='';groups.forEach((g,i)=>{const b=document.createElement('button');b.className='card'+(i===active?' active':'');b.style.setProperty('--color',g.color);b.setAttribute('aria-pressed',i===active?'true':'false');const strong=document.createElement('strong');strong.textContent=g.title;const span=document.createElement('span');span.textContent=g.simple[0];const small=document.createElement('small');small.textContent='Klik voor startzinnen →';b.append(strong,span,small);b.onclick=()=>select(i);cards.append(b)})}
function show(){if(active<0)return;const p=phrases(active);if(index>=p.length)index=0;document.querySelector('#selected').textContent=groups[active].title;sentence.textContent=p[index];document.querySelector('#counter').textContent=(index+1)+' / '+p.length;document.querySelector('#previous').disabled=p.length<2;document.querySelector('#next').disabled=p.length<2;document.querySelector('#repeat').disabled=!('speechSynthesis' in window)}
function select(i){active=i;index=0;renderCards();show()}
document.querySelector('#previous').onclick=()=>{index=(index-1+phrases(active).length)%phrases(active).length;show()};document.querySelector('#next').onclick=()=>{index=(index+1)%phrases(active).length;show()};document.querySelector('#random').onclick=()=>{const i=Math.floor(Math.random()*groups.length);select(i);index=Math.floor(Math.random()*phrases(i).length);show()};document.querySelector('#full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.()};document.querySelector('#repeat').onclick=()=>{if(active<0)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(phrases(active)[index].replace('…',''));u.lang='nl-NL';u.rate=.85;speechSynthesis.speak(u)};level.onchange=()=>{index=0;show()};document.addEventListener('keydown',e=>{if(e.target.matches('input,select'))return;if(active>=0&&e.key==='ArrowRight')document.querySelector('#next').click();if(active>=0&&e.key==='ArrowLeft')document.querySelector('#previous').click()});renderCards();
</script>
</body></html>
