<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Stoere Beweegbreak</title>
  <style>
    :root{--ink:#10223a;--cream:#fff8e7;--orange:#ff7a00;--yellow:#ffd23f;--blue:#29a9e8;--green:#38c172;--pink:#ef476f;--purple:#7357d9}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 12% 10%,#fff4a8 0 7%,transparent 7.2%),radial-gradient(circle at 90% 18%,#9ee7ff 0 8%,transparent 8.2%),linear-gradient(145deg,#e9fbff,#fff6dd);overflow-x:hidden}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.14;background-image:linear-gradient(45deg,#18324e 1px,transparent 1px),linear-gradient(-45deg,#18324e 1px,transparent 1px);background-size:42px 42px}
    .app{position:relative;width:min(1180px,96vw);margin:auto;padding:24px 0 32px}
    header{text-align:center;margin-bottom:16px} .eyebrow{display:inline-block;padding:7px 16px;border:3px solid var(--ink);border-radius:999px;background:var(--yellow);font-size:.78rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;box-shadow:4px 4px 0 var(--ink)}
    h1{margin:13px 0 4px;font-size:clamp(2rem,5vw,4.2rem);line-height:.95;text-transform:uppercase;letter-spacing:-.045em;text-shadow:3px 3px 0 #fff,6px 6px 0 rgba(16,34,58,.12)}
    .subtitle{margin:8px auto;max-width:700px;font-size:clamp(1rem,2vw,1.3rem);font-weight:700}
    main{display:grid;grid-template-columns:minmax(500px,1.18fr) minmax(320px,.82fr);gap:26px;align-items:center}
    .wheel-zone{position:relative;display:grid;place-items:center;min-height:650px}
    .pointer{position:absolute;z-index:5;top:5px;width:0;height:0;border-left:26px solid transparent;border-right:26px solid transparent;border-top:66px solid var(--ink);filter:drop-shadow(0 5px 0 rgba(255,255,255,.8))}
    .wheel-wrap{position:relative;width:min(620px,88vw);aspect-ratio:1;border-radius:50%;padding:12px;background:var(--ink);box-shadow:0 18px 0 rgba(16,34,58,.22),0 24px 45px rgba(16,34,58,.22)}
    canvas{width:100%;height:100%;display:block;border-radius:50%;background:white;transition:filter .2s}
    .hub{position:absolute;inset:50% auto auto 50%;transform:translate(-50%,-50%);width:112px;height:112px;border:8px solid var(--ink);border-radius:50%;background:var(--cream);display:grid;place-items:center;text-align:center;font-size:1.05rem;font-weight:1000;line-height:1;text-transform:uppercase;box-shadow:0 5px 0 rgba(16,34,58,.22);pointer-events:none}
    .panel{border:4px solid var(--ink);border-radius:28px;background:rgba(255,255,255,.92);padding:24px;box-shadow:10px 10px 0 var(--ink)}
    .result{min-height:210px;display:grid;place-items:center;text-align:center;border:4px dashed var(--ink);border-radius:20px;background:var(--cream);padding:18px}
    .result .icon{font-size:3.8rem;line-height:1}.result h2{font-size:clamp(1.7rem,3.2vw,2.7rem);line-height:1;margin:7px 0;text-transform:uppercase}.result p{font-size:1.08rem;font-weight:700;margin:4px 0}
    .timer{font-variant-numeric:tabular-nums;font-size:clamp(3rem,6vw,5rem);font-weight:1000;line-height:1;margin:12px 0;text-align:center}.timer.done{color:var(--pink);animation:pulse .45s 3 alternate}
    @keyframes pulse{to{transform:scale(1.1)}}
    button,select{font:inherit;font-weight:900;border:3px solid var(--ink);border-radius:14px;background:white;color:var(--ink);min-height:48px}.spin{width:100%;font-size:1.35rem;background:var(--orange);color:white;text-transform:uppercase;box-shadow:0 6px 0 var(--ink);cursor:pointer}.spin:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}.spin:disabled{filter:grayscale(.65);cursor:not-allowed}
    .settings{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:17px}.setting{display:grid;gap:5px;font-size:.82rem;font-weight:900;text-transform:uppercase}.setting select{padding:0 10px;background:#fff}
    .toggle{grid-column:1/-1;display:flex;align-items:center;gap:10px;text-transform:none;font-size:.95rem}.toggle input{width:22px;height:22px;accent-color:var(--green)}
    .tip{margin:16px 2px 0;font-size:.87rem;line-height:1.4;font-weight:650}.tip strong{color:#d64d00}
    .confetti{position:fixed;z-index:20;top:-20px;width:12px;height:20px;pointer-events:none;animation:fall 1.7s linear forwards}@keyframes fall{to{transform:translateY(105vh) rotate(800deg)}}
    @media(max-width:880px){main{grid-template-columns:1fr}.wheel-zone{min-height:auto;padding-top:45px}.wheel-wrap{width:min(620px,90vw)}.pointer{top:3px}.panel{width:min(620px,92vw);margin:auto}}
    @media(max-width:560px){.app{padding-top:14px}.wheel-zone{padding-top:35px}.wheel-wrap{padding:8px}.hub{width:78px;height:78px;border-width:5px;font-size:.76rem}.pointer{border-left-width:18px;border-right-width:18px;border-top-width:48px}.panel{padding:16px;box-shadow:6px 6px 0 var(--ink)}.settings{grid-template-columns:1fr}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}.confetti{display:none}}
  </style>
</head>
<body>
<div class="app">
  <header><span class="eyebrow">Powerpauze</span><h1>Stoere beweegbreak</h1><p class="subtitle">Draai het wiel, zet je brein aan en knal daarna weer door!</p></header>
  <main>
    <section class="wheel-zone" aria-label="Beweegwiel"><div class="pointer" aria-hidden="true"></div><div class="wheel-wrap"><canvas id="wheel" width="900" height="900"></canvas><div class="hub">Power<br>break</div></div></section>
    <aside class="panel">
      <div class="result" aria-live="polite"><div><div class="icon" id="icon">⚡</div><h2 id="move">Klaar?</h2><p id="how">Draai aan het wiel!</p></div></div>
      <div class="timer" id="timer" aria-live="polite">00:30</div>
      <button class="spin" id="spin">Draai het wiel!</button>
      <div class="settings">
        <label class="setting">Tijd<select id="duration"><option value="20">20 seconden</option><option value="30" selected>30 seconden</option><option value="45">45 seconden</option><option value="60">60 seconden</option></select></label>
        <label class="setting">Rondes<select id="rounds"><option value="1">1 ronde</option><option value="2">2 rondes</option><option value="3">3 rondes</option></select></label>
        <label class="toggle"><input type="checkbox" id="quiet"> Zonder springen (rustige alternatieven)</label>
      </div>
      <p class="tip"><strong>Veilig bewegen:</strong> zorg voor ruimte, land zacht en stop als iets pijn doet. De leerkracht kan een oefening altijd aanpassen.</p>
    </aside>
  </main>
</div>
<script>
const allMoves=[
 {n:'Plank',i:'💪',h:'Maak je lichaam recht als een plank.',q:{n:'Muurplank',i:'🧱',h:'Duw stevig tegen de muur.'}},
 {n:'Burpees',i:'🔥',h:'Hurken, handen neer, stap of spring uit, kom op.',q:{n:'Stap-burpees',i:'🔥',h:'Stap rustig naar achter en weer naar voren.'}},
 {n:'Jumping jacks',i:'⭐',h:'Spring open en dicht met armen omhoog.',q:{n:'Step jacks',i:'⭐',h:'Stap zijwaarts en zwaai je armen omhoog.'}},
 {n:'Bokser',i:'🥊',h:'Boks om en om krachtig voor je uit.',q:{n:'Bokser',i:'🥊',h:'Boks zittend of staand voor je uit.'}},
 {n:'Bergbeklimmer',i:'⛰️',h:'In plank: knieën om en om naar voren.',q:{n:'Kniehef',i:'⛰️',h:'Breng staand je knieën om en om omhoog.'}},
 {n:'Squats',i:'🦵',h:'Zak alsof je op een stoel gaat zitten.',q:{n:'Stoel-squats',i:'🪑',h:'Tik de stoel aan en kom weer omhoog.'}},
 {n:'Superheld',i:'🦸',h:'Ga lang liggen en til armen en benen op.',q:{n:'Superheld',i:'🦸',h:'Strek staand één arm en het andere been.'}},
 {n:'Schaatssprongen',i:'⛸️',h:'Spring zijwaarts van been naar been.',q:{n:'Schaatsstappen',i:'⛸️',h:'Stap groot zijwaarts van been naar been.'}},
 {n:'Bear crawl',i:'🐻',h:'Loop op handen en voeten, knieën laag.',q:{n:'Beer-tik',i:'🐻',h:'Tik om en om je hand tegen je knie.'}},
 {n:'High knees',i:'🚀',h:'Ren op je plek met je knieën hoog.',q:{n:'Knie-mars',i:'🚀',h:'Marcheer krachtig met hoge knieën.'}},
 {n:'Kick & punch',i:'🥋',h:'Wissel een voorwaartse trap en stoot af.',q:{n:'Kick & punch',i:'🥋',h:'Trap laag en boks gecontroleerd.'}},
 {n:'Krabbenloop',i:'🦀',h:'Buik omhoog: loop op handen en voeten.',q:{n:'Krabben-tik',i:'🦀',h:'Zittend: tik met je hand de andere knie.'}}
];
const colors=['#ff7a00','#ffd23f','#29a9e8','#38c172','#ef476f','#7357d9','#ff9f1c','#70d6ff','#8ac926','#ff595e','#6a4c93','#00b4d8'];
const canvas=document.querySelector('#wheel'),ctx=canvas.getContext('2d'),spin=document.querySelector('#spin'),timerEl=document.querySelector('#timer'),moveEl=document.querySelector('#move'),howEl=document.querySelector('#how'),iconEl=document.querySelector('#icon'),quiet=document.querySelector('#quiet');
let rotation=0,spinning=false,timerId=null;
function draw(rot=0){const S=canvas.width,c=S/2,r=c-10,arc=Math.PI*2/allMoves.length;ctx.clearRect(0,0,S,S);ctx.save();ctx.translate(c,c);ctx.rotate(rot);allMoves.forEach((m,k)=>{const a=-Math.PI/2+k*arc;ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,r,a,a+arc);ctx.closePath();ctx.fillStyle=colors[k];ctx.fill();ctx.lineWidth=7;ctx.strokeStyle='#10223a';ctx.stroke();ctx.save();ctx.rotate(a+arc/2);ctx.textAlign='right';ctx.textBaseline='middle';ctx.fillStyle=k===5||k===10?'white':'#10223a';ctx.font='900 25px system-ui';const label=m.n.length>14?m.n.replace(' ','\n'):m.n;label.split('\n').forEach((line,j,arr)=>ctx.fillText(line,r-35,(j-(arr.length-1)/2)*29));ctx.restore()});ctx.restore()}
draw();
function beep(freq=700,d=.12){try{const ac=new(AudioContext||webkitAudioContext)(),o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.frequency.value=freq;g.gain.setValueAtTime(.08,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function format(s){return '00:'+String(s).padStart(2,'0')}
function startTimer(seconds,rounds){clearInterval(timerId);let total=seconds*rounds;timerEl.classList.remove('done');timerEl.textContent=format(total);timerId=setInterval(()=>{total--;timerEl.textContent=total>=60?String(Math.floor(total/60)).padStart(2,'0')+':'+String(total%60).padStart(2,'0'):format(total);if(total<=3&&total>0)beep(520+total*90,.08);if(total<=0){clearInterval(timerId);timerEl.textContent='KLAAR!';timerEl.classList.add('done');beep(900,.28);confetti();spin.disabled=false;spin.textContent='Nog een keer!'}},1000)}
function confetti(){for(let k=0;k<55;k++){const x=document.createElement('i');x.className='confetti';x.style.left=Math.random()*100+'vw';x.style.background=colors[k%colors.length];x.style.animationDelay=Math.random()*.35+'s';x.style.transform='rotate('+Math.random()*180+'deg)';document.body.appendChild(x);setTimeout(()=>x.remove(),2300)}}
spin.addEventListener('click',()=>{if(spinning)return;clearInterval(timerId);timerEl.classList.remove('done');spinning=true;spin.disabled=true;spin.textContent='Daar gaat-ie…';moveEl.textContent='Spannend!';howEl.textContent='Kijk waar de pijl stopt.';iconEl.textContent='🌀';const winner=Math.floor(Math.random()*allMoves.length),arc=Math.PI*2/allMoves.length,target=-(winner*arc+arc/2);const from=rotation,to=target+Math.PI*2*(6+Math.floor(Math.random()*3)),start=performance.now(),dur=4200;function frame(now){let t=Math.min(1,(now-start)/dur),ease=1-Math.pow(1-t,4);rotation=from+(to-from)*ease;draw(rotation);if(t<1)requestAnimationFrame(frame);else{rotation=((rotation%(Math.PI*2))+Math.PI*2)%(Math.PI*2);spinning=false;const chosen=quiet.checked?allMoves[winner].q:allMoves[winner];iconEl.textContent=chosen.i;moveEl.textContent=chosen.n;howEl.textContent=chosen.h;beep(760,.18);setTimeout(()=>startTimer(+document.querySelector('#duration').value,+document.querySelector('#rounds').value),550)}}requestAnimationFrame(frame)});
document.querySelector('#duration').addEventListener('change',e=>{if(!timerId)timerEl.textContent=format(+e.target.value)});
window.addEventListener('keydown',e=>{if((e.code==='Space'||e.code==='Enter')&&!spinning){e.preventDefault();spin.click()}});
</script>
</body>
</html>
