<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Story Cubes</title>
    <style>
body {
    font-family: Arial, sans-serif;
    background: #eef3f8;
    text-align: center;
    margin: 0;
    padding: 20px;
}
h1 { color: #2c3e50; }
.container {
    display: flex;
    justify-content: center;
    gap: 40px;
    margin: 40px 0;
    flex-wrap: wrap;
}
.scene {
    width: 150px;
    height: 150px;
    perspective: 800px;
}
.cube {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 1.5s ease;
}
.face {
    position: absolute;
    width: 150px;
    height: 150px;
    background: white;
    border-radius: 20px;
    border: 3px solid #d9d9d9;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 60px;
    box-shadow: 0 4px 10px rgba(0,0,0,.15);
}
.front  { transform: rotateY(0deg)   translateZ(75px); }
.back   { transform: rotateY(180deg) translateZ(75px); }
.right  { transform: rotateY(90deg)  translateZ(75px); }
.left   { transform: rotateY(-90deg) translateZ(75px); }
.top    { transform: rotateX(90deg)  translateZ(75px); }
.bottom { transform: rotateX(-90deg) translateZ(75px); }
button {
    padding: 15px 35px;
    font-size: 20px;
    border: none;
    border-radius: 10px;
    background: #3498db;
    color: white;
    cursor: pointer;
}
button:hover { background: #2980b9; }
.story-box {
    margin: 30px auto;
    max-width: 800px;
    background: white;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 4px 10px rgba(0,0,0,.1);
}
textarea {
    width: 95%;
    height: 220px;
    font-size: 18px;
    padding: 10px;
}
    </style>
</head>
<body>

<h1>🎲 3D Story Cubes</h1>
<p>Gooi de dobbelstenen en schrijf een verhaal!</p>

<div class="container">
    <div class="scene">
        <div class="cube" id="cubeWho">
            <div class="face front">🧙</div>
            <div class="face back">👸</div>
            <div class="face right">🦖</div>
            <div class="face left">👨‍🚀</div>
            <div class="face top">🐶</div>
            <div class="face bottom">🦸</div>
        </div>
    </div>
    <div class="scene">
        <div class="cube" id="cubeWhat">
            <div class="face front">🗺️</div>
            <div class="face back">🚀</div>
            <div class="face right">🔍</div>
            <div class="face left">🐉</div>
            <div class="face top">⚡</div>
            <div class="face bottom">🎁</div>
        </div>
    </div>
    <div class="scene">
        <div class="cube" id="cubeWhere">
            <div class="face front">🏰</div>
            <div class="face back">🌳</div>
            <div class="face right">🚀</div>
            <div class="face left">🏝️</div>
            <div class="face top">🏫</div>
            <div class="face bottom">❄️</div>
        </div>
    </div>
</div>

<button onclick="rollAll()">🎲 Gooien</button>

<div class="story-box">
    <h2>Verhaalopdracht</h2>
    <p id="storyPrompt">Klik op Gooien om te beginnen!</p>
    <textarea placeholder="Schrijf hier jouw verhaal..."></textarea>
</div>

<script>
const who  = ["Tovenaar","Prinses","Dinosaurus","Astronaut","Hond","Superheld"];
const what = ["zoekt een schat","maakt een reis","lost een mysterie op","ontmoet een draak","krijgt magische krachten","vindt een geheim cadeau"];
const where = ["in een kasteel","in een bos","in de ruimte","op een eiland","op school","op de Noordpool"];

const cubeRotations = [
    "rotateX(0deg) rotateY(0deg)",
    "rotateY(180deg)",
    "rotateY(-90deg)",
    "rotateY(90deg)",
    "rotateX(-90deg)",
    "rotateX(90deg)"
];

function rollCube(cubeId) {
    const cube = document.getElementById(cubeId);
    const face = Math.floor(Math.random() * 6);
    const extraX = 720 + Math.floor(Math.random() * 360);
    const extraY = 720 + Math.floor(Math.random() * 360);
    cube.style.transform = `rotateX(${extraX}deg) rotateY(${extraY}deg)`;
    setTimeout(() => { cube.style.transform = cubeRotations[face]; }, 1200);
    return face;
}

function rollAll() {
    const whoFace   = rollCube("cubeWho");
    const whatFace  = rollCube("cubeWhat");
    const whereFace = rollCube("cubeWhere");
    setTimeout(() => {
        document.getElementById("storyPrompt").innerHTML =
            `<strong>${who[whoFace]}</strong> ${what[whatFace]} ${where[whereFace]}.`;
    }, 1400);
}
</script>
</body>
</html>
